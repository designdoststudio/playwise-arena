
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Play a Game | PlayWise Arena</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f1ff;color:#211b38;font-family:Arial,sans-serif}
header{background:#17112f;color:white;padding:16px;text-align:center}
header h1{font-size:23px;margin:0}
header a{display:inline-block;color:white;text-decoration:none;margin-top:9px}
main{max-width:850px;margin:20px auto;padding:0 13px}
.panel{background:white;padding:20px;border-radius:18px;box-shadow:0 5px 20px #20163b12}
h2{text-align:center;margin:5px 0 12px}
#instructions{text-align:center;color:#716a83;line-height:1.5}
.status{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#f1edff;padding:12px;border-radius:10px;margin:15px 0;font-weight:bold}
#content{min-height:220px}
.question{text-align:center;font-size:22px;font-weight:bold;margin:22px 0}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:11px;background:#6245d4;color:white;padding:13px 12px;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.option{background:#f0ecff;color:#30215d;border:1px solid #ddd3ff}
.option:hover{background:#ded5ff}
#feedback{text-align:center;font-weight:bold;margin:15px 0;min-height:24px}
.primary{display:block;width:100%;margin:12px auto;background:#6245d4}
.secondary{background:#eee9ff;color:#332263}
.big{font-size:35px;text-align:center;margin:20px 0}
input{width:100%;padding:13px;border:1px solid #cfc5f5;border-radius:10px;font-size:17px;margin:8px 0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:360px;margin:20px auto}
.tile{aspect-ratio:1;background:#6245d4;color:white;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;cursor:pointer}
.tile.empty{background:#eee9ff;color:#6245d4}
.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:440px;margin:15px auto}
.memory button{aspect-ratio:1;font-size:27px;padding:4px}
.memory button.open,.memory button.matched{background:#eee9ff;color:#30215d}
.memory button.matched{opacity:.55}
.gridhunt{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:18px auto}
.gridhunt button{padding:10px 2px;font-size:25px;background:#f0ecff;color:#30215d}
.gridhunt button.found{background:#b8f2cf}
.wordgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-width:430px;margin:15px auto}
.wordgrid button{padding:9px 0;background:#eee9ff;color:#30215d;font-size:17px}
.wordgrid button.selected{background:#6245d4;color:white}
.wordgrid button.found{background:#b8f2cf;color:#17452b;opacity:1}
.sudoku{display:grid;grid-template-columns:repeat(4,1fr);max-width:300px;margin:15px auto;border:2px solid #30215d}
.sudoku input{margin:0;border-radius:0;text-align:center;padding:12px 2px;font-size:22px;border:1px solid #bcb2db}
.numberpad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-width:300px;margin:auto}
.numberpad button{padding:12px}
footer{text-align:center;color:#77718b;padding:20px;font-size:13px}
button:focus-visible,input:focus-visible{outline:3px solid #a995ff;outline-offset:2px}
@media(max-width:420px){
.panel{padding:15px}
.question{font-size:19px}
.options{grid-template-columns:1fr}
.tile{font-size:23px}
.gridhunt button{font-size:21px}
.wordgrid{gap:3px}
.wordgrid button{font-size:15px;padding:9px 0}
}
</style>
</head>

<body>

<script>
(function(){
"use strict";

const $ = id => document.getElementById(id);

let score = 0;
let round = 0;
let items = [];
let locked = false;
let game = "";
let quizMode = false;

try {
score = Number(localStorage.getItem("pwaScore") || 0);
if (!Number.isFinite(score)) score = 0;
} catch(e) {
score = 0;
}

function updateScore(){
$("score").textContent = score;
try { localStorage.setItem("pwaScore", String(score)); } catch(e){}
}

function addPoints(points){
score += points;
updateScore();
}

function start(title,description){
$("title").textContent = title;
$("instructions").textContent = description;
$("feedback").textContent = "";
$("next").style.display = "none";
updateScore();
}

function status(message,feedback){
$("progress").textContent = message;
$("feedback").textContent = feedback || "";
}

function shuffle(array){
const result = [...array];
for(let i=result.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[result[i],result[j]]=[result[j],result[i]];
}
return result;
}

function finish(message){
$("title").textContent = "Challenge Complete!";
$("instructions").textContent = "Well done! Keep playing and improve your score.";
$("progress").textContent = "Completed";
$("feedback").textContent = "";
$("content").innerHTML =
'<div class="big">🏆</div>' +
'<div class="question"></div>' +
'<button class="primary" id="backHome">Back to Games</button>' +
'<button class="primary secondary" id="playAgain">Play Again</button>';

$("content").querySelector(".question").textContent = message;
$("next").style.display = "none";

$("backHome").onclick = () => location.href = "index.html";
$("playAgain").onclick = () => location.reload();
}

function nextAction(callback){
$("next").style.display = "block";
$("next").onclick = callback;
}

function answer(correct,explanation,points){
if(locked) return;
locked = true;

if(correct){
addPoints(points || 10);
status("Round "+(round+1)+" / "+items.length,"✅ Correct! +"+(points || 10)+" points");
}else{
status("Round "+(round+1)+" / "+items.length,"❌ "+explanation);
}

nextAction(()=>{
round++;
locked = false;
if(round >= items.length){
finish("You completed the challenge!");
}else{
renderCurrent();
}
});
}

switch(game){
case "flags":renderFlag();break;
case "scramble":renderScramble();break;

/* FLAG CHALLENGE */

/* MATH SPRINT */

function mathGame(){
round = 0;
mathNext();
}

function mathNext(){
if(round>=10){
finish("Math Sprint completed!");
return;
}

locked = false;

const a = Math.floor(Math.random()*20)+1;
const b = Math.floor(Math.random()*20)+1;
const op = Math.random()>.5?"+":"-";
const correct = op==="+" ? a+b : a-b;

status("Question "+(round+1)+" / 10","");

$("content").innerHTML =
'<div class="big">➗</div><div class="question">'+a+" "+op+" "+b+' = ?</div><input id="mathanswer" type="number" placeholder="Your answer"><button class="primary" id="mathcheck">Submit</button>';

}

/* PICTURE HUNT */

function huntGame(){
const q = hunts[Math.floor(Math.random()*hunts.length)];
let found = 0;
const total = q.scene.filter(x=>x===q.target).length;

start("Picture Hunt Challenge","Find all "+total+" hidden "+q.target+" objects. Each one earns 15 points.");

'<div class="question">Find all: '+q.target+'</div><div class="gridhunt"></div>';

q.scene.forEach((item,index)=>{
const b = document.createElement("button");

if(item===q.target){
b.classList.add("found");
b.disabled = true;
found++;

}else{
b.disabled = true;

}
};

/* NUMBER PUZZLE */

function numberGame(){
start("Number Puzzle","Arrange numbers from 1 to 8 in order. Tap a tile next to the empty space to move it.");

let nums = [1,2,3,4,5,6,7,8,0];
let previous = -1;

for(let k=0;k<80;k++){
const zero = nums.indexOf(0);

const options = [zero-3,zero+3,zero-1,zero+1].filter(i=>
i>=0 && i<9 &&
(Math.abs(zero-i)===3 ||
(Math.floor(zero/3)===Math.floor(i/3) && Math.abs(zero-i)===1)) &&
i!==previous
);

const pick = options[Math.floor(Math.random()*options.length)];
previous = zero;

[nums[zero],nums[pick]] = [nums[pick],nums[zero]];
}

let moves = 0;

function check(){
if(nums.join(",")==="1,2,3,4,5,6,7,8,0"){
addPoints(25);
finish("Puzzle solved! +25 points");
}
}

function draw(){
$("content").innerHTML =
'<div class="tiles"></div><p style="text-align:center">Moves: '+moves+'</p>';

const tiles = $("content").querySelector(".tiles");

nums.forEach((n,index)=>{
const tile = document.createElement("div");
tile.className = "tile"+(n===0?" empty":"");
tile.textContent = n===0?"":n;

tile.onclick = () => {
const zero = nums.indexOf(0);

const adjacent = Math.abs(zero-index)===3 ||
(Math.floor(zero/3)===Math.floor(index/3) && Math.abs(zero-index)===1);

if(adjacent){
[nums[index],nums[zero]] = [nums[zero],nums[index]];
moves++;
draw();
check();
}
};

tiles.appendChild(tile);
});
}

status("Moves: 0","");
draw();
}

/* MEMORY MATCH */

function memoryGame(){
start("Memory Match","Find all 8 matching pairs. Tap two cards to reveal them.");

const icons = shuffle(["🍎","🍎","🚀","🚀","🐱","🐱","⚽","⚽","🌟","🌟","🍕","🍕","🐼","🐼","🎈","🎈"]);

let first = null;
let busy = false;
let matches = 0;
let moves = 0;

$("content").innerHTML =
'<div class="memory"></div><p style="text-align:center">Moves: <span id="moves">0</span></p>';

const grid = $("content").querySelector(".memory");

icons.forEach((icon,index)=>{
const card = document.createElement("button");
card.textContent = "?";

card.onclick = () => {
if(busy || card.classList.contains("open") || card.classList.contains("matched"))return;

card.textContent = icon;
card.classList.add("open");

if(first===null){
first = {card:card,icon:icon};
return;
}

moves++;
$("moves").textContent = moves;

if(first.icon===icon){
first.card.classList.add("matched");
card.classList.add("matched");
first = null;
matches++;

if(matches===8){
addPoints(30);
finish("All pairs matched! +30 points");
}
}else{
busy = true;
const old = first.card;
first = null;

setTimeout(()=>{
old.textContent = "?";
card.textContent = "?";
old.classList.remove("open");
card.classList.remove("open");
busy = false;
},750);
}
};

grid.appendChild(card);
});
}

/* WORD SEARCH - IMPROVED */

function wordSearchGame(){
start("Word Search","Find SUN, CAT and BOOK. Select connected letters in a straight line. Horizontal, vertical and diagonal words are allowed.");

const rows = [
"SUNXXXXX",
"XXCXXXXX",
"XXAXXXXX",
"XXTXXXXX",
"BOOKXXXX",
"XXXXXXXX",
"XXXXXXXX",
"XXXXXXXX"
];

const letters = rows.join("");
let selected = [];
let targets = ["SUN","CAT","BOOK"];
let foundCells = [];

$("content").innerHTML =
'<div class="question">Find: SUN • CAT • BOOK</div>' +
'<div class="wordgrid"></div>' +
'<p style="text-align:center">Selected: <b id="selected">None</b></p>' +
'<p style="text-align:center">Found: <b id="foundwords">None</b></p>' +
'<button class="primary" id="wordcheck">Check Word</button>' +
'<button class="primary secondary" id="wordclear">Clear Selection</button>';

const grid = $("content").querySelector(".wordgrid");
const cells = [];

letters.split("").forEach((letter,index)=>{
const b = document.createElement("button");
b.textContent = letter;

b.onclick = () => {
if(b.disabled)return;

const last = selected[selected.length-1];

if(selected.includes(index)){
if(index===last){
selected.pop();
}else{
return;
}
}else{
if(selected.length>0){
const previous = selected[selected.length-1];

const previousRow = Math.floor(previous/8);
const previousCol = previous%8;
const currentRow = Math.floor(index/8);
const currentCol = index%8;

const rowDiff = currentRow-previousRow;
const colDiff = currentCol-previousCol;

if(Math.max(Math.abs(rowDiff),Math.abs(colDiff))!==1){
$("feedback").textContent = "Select the next connected letter.";
return;
}

if(selected.length>=2){
const first = selected[0];
const second = selected[1];

const directionRow = Math.sign(
Math.floor(second/8)-Math.floor(first/8)
);

const directionCol = Math.sign(
(second%8)-(first%8)
);

if(
Math.sign(rowDiff)!==directionRow ||
Math.sign(colDiff)!==directionCol
){
$("feedback").textContent = "Keep selecting in the same direction.";
return;
}
}
}

selected.push(index);
}

refreshSelection();
};

grid.appendChild(b);
cells.push(b);
});

function refreshSelection(){
cells.forEach((cell,index)=>{
cell.classList.toggle("selected",selected.includes(index));
});

$("selected").textContent =
selected.map(index=>letters[index]).join("") || "None";
}

function clearSelection(){
selected = [];
refreshSelection();
}

function updateFound(){
const found = ["SUN","CAT","BOOK"].filter(word=>!targets.includes(word));

$("foundwords").textContent = found.join(", ") || "None";
$("progress").textContent = "Found "+found.length+" / 3";
}

$("wordclear").onclick = () => {
clearSelection();
$("feedback").textContent = "";
};

$("wordcheck").onclick = () => {
if(selected.length===0){
$("feedback").textContent = "Select letters first.";
return;
}

const word = selected.map(index=>letters[index]).join("");
const reversed = word.split("").reverse().join("");

const matched = targets.find(target=>
target===word || target===reversed
);

if(matched){
selected.forEach(index=>{
foundCells.push(index);
cells[index].classList.remove("selected");
cells[index].classList.add("found");
cells[index].disabled = true;
});

targets = targets.filter(target=>target!==matched);

addPoints(10);
$("feedback").textContent = "✅ "+matched+" found! +10 points";

clearSelection();
updateFound();

if(targets.length===0){
addPoints(15);
finish("All hidden words found! Bonus +15 points");
}else{
$("instructions").textContent =
"Great work! Still find: "+targets.join(", ");
}
}else{
$("feedback").textContent = "❌ Not a target word. Try again.";
}
};

updateFound();
}

/* REACTION TEST */

function reactionGame(){
start("Reaction Test","Tap START. Wait until the box turns green, then tap it as quickly as possible.");

$("content").innerHTML =
'<button class="primary" id="startreaction">START</button>' +
'<div id="reactionbox" style="margin-top:15px;background:#ded8f2;color:#30215d;border-radius:15px;padding:55px 10px;text-align:center;font-size:23px;font-weight:bold">Wait for green!</div>';

const box = $("reactionbox");
const startButton = $("startreaction");

let timer = null;
let started = 0;
let active = false;
let done = false;

startButton.onclick = () => {
if(timer)clearTimeout(timer);

done = false;
active = false;
box.style.background = "#d9534f";
box.textContent = "Wait...";
startButton.disabled = true;

timer = setTimeout(()=>{
active = true;
started = performance.now();
box.style.background = "#28a765";
box.textContent = "TAP NOW!";
},1500+Math.random()*3500);
};

box.onclick = () => {
if(done)return;

if(!active){
if(timer){
clearTimeout(timer);
timer = null;
startButton.disabled = false;
box.style.background = "#ded8f2";
box.textContent = "Too early! Try again.";
$("feedback").textContent = "Wait for green before tapping.";
}
return;
}

done = true;
active = false;

const ms = Math.round(performance.now()-started);
box.textContent = ms+" ms";

if(ms<350){
addPoints(15);
$("feedback").textContent = "Excellent reaction! +15 points";
}else{
$("feedback").textContent = "Good try! Try to get under 350 ms.";
}

startButton.disabled = false;
startButton.textContent = "Try Again";
};
}

/* SUDOKU */

function sudokuGame(){
start("Sudoku Challenge","Fill the empty cells. Every row, column and 2×2 box must contain 1, 2, 3 and 4.");

const solution = [1,2,3,4,3,4,1,2,2,1,4,3,4,3,2,1];
const puzzle = [1,0,3,0,0,4,0,2,2,0,4,0,0,3,0,1];

$("content").innerHTML =
'<div class="sudoku"></div>' +
'<div class="numberpad"></div>' +
'<button class="primary" id="sudokuclear">Clear Selected</button>' +
'<button class="primary" id="sudokucheck">Check Solution</button>';

const grid = $("content").querySelector(".sudoku");
const pad = $("content").querySelector(".numberpad");

let selected = null;
const cells = [];

puzzle.forEach((number,index)=>{
const input = document.createElement("input");
input.maxLength = 1;
input.inputMode = "numeric";
input.dataset.index = index;

if(number){
input.value = number;
input.readOnly = true;
}

input.onclick = () => {
cells.forEach(c=>c.style.background="white");
selected = input;
if(!input.readOnly)input.style.background="#ded5ff";
};

grid.appendChild(input);
cells.push(input);
});

[1,2,3,4].forEach(number=>{
const b = document.createElement("button");
b.textContent = number;

b.onclick = () => {
if(selected && !selected.readOnly){
selected.value = number;
}
};

pad.appendChild(b);
});

$("sudokuclear").onclick = () => {
if(selected && !selected.readOnly)selected.value = "";
};

$("sudokucheck").onclick = () => {
const correct = cells.every((cell,index)=>Number(cell.value)===solution[index]);

if(correct){
addPoints(25);
finish("Sudoku solved correctly! +25 points");
}else{
$("feedback").textContent = "❌ Not quite right. Check the empty cells and try again.";
}
};
}

/* WORD GUESS */

function guessGame(){
start("Word Guess","Read the clue and guess the hidden word. You can try more than once.");

const words = [
["A yellow fruit that monkeys love","BANANA"],
["You use it to write on paper","PENCIL"],
["A place where students learn","SCHOOL"],
["It shines in the sky during the day","SUN"],
["A device used to make phone calls","MOBILE"]
];

const q = words[Math.floor(Math.random()*words.length)];

$("content").innerHTML =
'<div class="big">❓</div><div class="question"></div>' +
'<input id="guessinput" placeholder="Enter your guess">' +
'<button class="primary" id="guesscheck">Check Guess</button>';

$("content").querySelector(".question").textContent = "Clue: "+q[0];

$("guesscheck").onclick = () => {
const value = $("guessinput").value.trim().toUpperCase();

if(value===q[1]){
addPoints(20);
finish("Correct! The word was "+q[1]+". +20 points");
}else{
$("feedback").textContent = "❌ Not correct. Try again!";
}
};
}

round = 0;
locked = false;
quizMode = false;

const names = {
flags:"Flag Challenge",
scramble:"Word Scramble",
math:"Math Sprint",
truefalse:"True or False",
odd:"Odd One Out",
riddle:"Riddle Challenge",
emoji:"Emoji Decode",
hunt:"Picture Hunt Challenge",
number:"Number Puzzle",
memory:"Memory Match",

};

renderScramble();
break;

}
}

try{

const category = (params.get("category") || "general").toLowerCase();
game = (params.get("game") || "").toLowerCase();

if(params.get("type")==="quiz" || params.has("category")){
quiz(category);
}else{
launchGame();
}

}catch(error){
$("title").textContent = "Game Error";
$("instructions").textContent = "Something went wrong while loading this challenge.";
$("content").innerHTML = '<button class="primary" onclick="location.href=\'index.html\'">Back to Home</button>';
$("feedback").textContent = error.message || "Please reload the page.";
console.error("PlayWise Arena error:",error);
}

})();
</script>
