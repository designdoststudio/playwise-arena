<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17112f">
<meta name="robots" content="noindex,follow">
<title>Play a Game | PlayWise Arena</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100d20;color:#f7f5ff;font-family:Arial,sans-serif}
header{background:#1c1636;padding:16px;text-align:center;border-bottom:1px solid #392d60}
header a{color:#c8baff;text-decoration:none;font-size:14px}
h1{font-size:23px;margin:9px 0 4px}
header p{margin:5px;color:#c4bddb;font-size:13px}
main{max-width:850px;margin:auto;padding:14px}
.panel{background:#1c1732;border:1px solid #382e59;border-radius:17px;padding:15px;margin:12px 0}
h2{font-size:20px}
button,select,input{font:inherit}
button{border:0;border-radius:10px;padding:11px 14px;background:#7958ed;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.4}
.secondary{background:#342a50;color:#eee}
.green{background:#16885e}
.danger{background:#b94459}
input,select{padding:11px;border-radius:9px;border:1px solid #594b78;background:#110d20;color:white;margin:5px 0;max-width:100%}
.small{font-size:13px;color:#c7bfdc;line-height:1.5}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:#30264b;border-radius:9px;padding:9px 12px;font-size:13px}
#gameTitle{font-size:22px;font-weight:bold;margin-bottom:10px}
#status{color:#d4c9ff;font-weight:bold;margin:10px 0;min-height:22px}
#gameArea{min-height:180px}
.levelbar{height:8px;background:#33294d;border-radius:20px;overflow:hidden;margin:10px 0}
.levelbar span{display:block;height:100%;background:#9b7cff}
.grid{display:grid;gap:6px}
.option{display:block;width:100%;margin:7px 0;text-align:left;background:#30264b}
.diff-pictures{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.picture{position:relative;background:#292044;border-radius:12px;padding:7px;min-width:0}
.picture svg{width:100%;display:block}
.diff-mark{position:absolute;border:3px solid #ffe15b;border-radius:50%;width:26px;height:26px;transform:translate(-50%,-50%);pointer-events:none}
.candy{aspect-ratio:1;border-radius:9px;font-size:clamp(19px,5vw,30px);padding:0;min-width:0}
.candy.selected{outline:3px solid white}
#raceCanvas{width:100%;max-width:420px;display:block;margin:auto;border-radius:12px;touch-action:none;background:#333}
.race-controls{display:flex;justify-content:center;gap:22px;margin:12px}
.race-controls button{font-size:23px;min-width:80px}
.ludo-board{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;max-width:420px;margin:14px auto;background:#66577f;padding:5px;border-radius:10px}
.ludo-cell{aspect-ratio:1;background:#eee8ff;color:#21172c;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:clamp(10px,3vw,17px);font-weight:bold;min-width:0}
.ludo-cell.red{background:#f29b9b}.ludo-cell.green{background:#8ee0b4}.ludo-cell.yellow{background:#ffe18b}.ludo-cell.blue{background:#9ccaff}
.ludo-cell button{padding:2px;width:100%;height:100%;font-size:clamp(10px,3vw,16px);background:transparent;color:#21172c}
.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.memory-card{aspect-ratio:1;font-size:clamp(20px,7vw,34px);padding:0;background:#342a50}
.letter-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:350px;margin:12px auto}
.letter-grid button{padding:12px 0;background:#342a50}
.sudoku-grid{display:grid;grid-template-columns:repeat(4,1fr);max-width:300px;margin:12px auto;border:2px solid #bca9ff;gap:2px}
.sudoku-grid input{width:100%;height:55px;margin:0;text-align:center;font-size:22px;padding:0;border-radius:0}
.number-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:330px;margin:12px auto}
.number-grid button{aspect-ratio:1;font-size:23px}
footer{text-align:center;padding:20px;color:#aaa;font-size:12px}
@media(max-width:480px){main{padding:9px}.panel{padding:12px}.diff-pictures{gap:5px}}
</style>
</head>
<body>
<header>
<a href="./">← PlayWise Arena Home</a>
<h1>🎮 PlayWise Arena</h1>
<p>Play, learn and challenge yourself!</p>
</header>
<main>
<section class="panel">
<div id="gameTitle">Loading game...</div>
<div class="stats">
<div class="stat">⭐ Score: <span id="score">0</span></div>
<div class="stat">🏆 Level: <span id="level">1</span></div>
<div class="stat">🔓 Unlocked: <span id="unlocked">1</span></div>
</div>
<div class="levelbar"><span id="progress" style="width:0%"></span></div>
<div class="small" id="difficulty"></div>
<div id="status">Get ready!</div>
</section>
<section class="panel">
<div id="gameArea"></div>
<div id="actions" style="margin-top:14px"></div>
</section>
<section class="panel">
<h3>🎯 Your Progress</h3>
<p class="small">Progress is saved in this browser on this device. Clearing browser data may erase it.</p>
<button class="secondary" onclick="resetCurrent()">Reset This Game</button>
<button class="secondary" onclick="location.href='./'">Back to Home</button>
</section>
</main>
<footer>PlayWise Arena · Created &amp; Managed by Muhammad Bilal</footer>
<script>
(function(){
"use strict";
const params=new URLSearchParams(location.search);
const game=params.get("game")||"flags";
const type=params.get("type")||"game";
const category=params.get("category")||"general";
const $=id=>document.getElementById(id);
const area=$("gameArea"),actions=$("actions");
const names={
difference:"Find the Difference",match3:"Match-3 Puzzle",racing:"Car Racing",ludo:"Ludo",
flags:"Flag Challenge",scramble:"Word Scramble",math:"Math Sprint",truefalse:"True or False",
odd:"Odd One Out",riddle:"Riddle Challenge",emoji:"Emoji Decode",hunt:"Picture Hunt",
number:"Number Puzzle",memory:"Memory Match",wordsearch:"Word Search",reaction:"Reaction Test",
sudoku:"Sudoku Challenge",guess:"Word Guess"
};
const key="pwa_"+(type==="quiz"?"quiz_"+category:game);
let saved={};try{saved=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){}
let level=Math.max(1,+saved.level||1),score=Math.max(0,+saved.score||0);
let unlocked=Math.max(level,+saved.unlocked||1),roundDone=false;
let timer=null,raf=null;
function save(){
try{localStorage.setItem(key,JSON.stringify({level,score,unlocked}))}catch(e){}
try{
let total=0;
for(let i=0;i<localStorage.length;i++){
let k=localStorage.key(i);
if(k&&k.startsWith("pwa_")&&k!=="pwaScore"){
try{total+=Math.max(0,+(JSON.parse(localStorage.getItem(k)||"{}").score)||0)}catch(e){}
}
}
localStorage.setItem("pwaScore",String(total));
}catch(e){}
}
function update(){
$("score").textContent=score;$("level").textContent=level;$("unlocked").textContent=unlocked;
$("difficulty").textContent="Difficulty: "+(level<10?"Beginner":level<30?"Easy":level<70?"Medium":level<150?"Hard":"Expert");
$("progress").style.width=(level%10===0?100:level%10*10)+"%";save();
}
function status(t){$("status").textContent=t}
function btn(t,fn,cls=""){
let b=document.createElement("button");b.textContent=t;b.className=cls;b.onclick=fn;return b;
}
function finish(points=10,msg="Level completed!"){
if(roundDone)return;roundDone=true;score+=points;unlocked=Math.max(unlocked,level+1);
status("🎉 "+msg+"  +"+points+" points!");update();actions.innerHTML="";
actions.append(btn("Next Level →",()=>{level++;roundDone=false;start()},"green"));
}
function retry(msg="Try again!"){
status(msg);actions.innerHTML="";actions.append(btn("Try Again",start));
}
function intro(title,desc){
$("gameTitle").textContent=title;area.innerHTML="<p class='small'>"+desc+"</p>";actions.innerHTML="";
}
function start(){
if(raf){cancelAnimationFrame(raf);raf=null}
if(timer){clearTimeout(timer);timer=null}
roundDone=false;actions.innerHTML="";update();
$("gameTitle").textContent="🎮 "+(names[game]||"Play a Game");
if(type==="quiz"){startQuiz();return}
const fn={
difference:startDifference,match3:startMatch3,racing:startRacing,ludo:startLudo,
flags:startFlags,scramble:startScramble,math:startMath,truefalse:startTrueFalse,
odd:startOdd,riddle:startRiddle,emoji:startEmoji,hunt:startHunt,number:startNumber,
memory:startMemory,wordsearch:startWordSearch,reaction:startReaction,sudoku:startSudoku,guess:startGuess
}[game];
if(fn)fn();else area.innerHTML="<p>Game not found. Return to homepage.</p>";
}

/* QUIZZES */
const quizzes={
general:[
["Which is the largest ocean?",["Pacific","Atlantic","Indian","Arctic"],0],
["How many days are in a leap year?",["364","365","366","367"],2],
["Which planet is called the Red Planet?",["Venus","Mars","Jupiter","Saturn"],1],
["What is the capital of Japan?",["Seoul","Tokyo","Beijing","Bangkok"],1],
["How many sides has a hexagon?",["5","6","7","8"],1]],
science:[
["Which gas do plants absorb?",["Oxygen","Carbon dioxide","Nitrogen","Hydrogen"],1],
["What is H2O?",["Salt","Water","Oxygen","Sugar"],1],
["Which organ pumps blood?",["Lungs","Brain","Heart","Liver"],2],
["Earth's natural satellite?",["Sun","Moon","Mars","Venus"],1],
["Which force pulls objects down?",["Magnetism","Gravity","Friction","Light"],1]],
sports:[
["Players on a football team on the field?",["9","10","11","12"],2],
["Which sport uses a shuttlecock?",["Tennis","Badminton","Hockey","Cricket"],1],
["A cricket boundary over the rope scores?",["2","3","4","6"],2],
["Wimbledon is associated with?",["Tennis","Football","Golf","Rugby"],0],
["Olympic symbol has how many rings?",["4","5","6","7"],1]],
pakistan:[
["Capital of Pakistan?",["Lahore","Karachi","Islamabad","Quetta"],2],
["Pakistan became independent in?",["1940","1947","1956","1965"],1],
["National language of Pakistan?",["Punjabi","Urdu","Sindhi","Pashto"],1],
["Pakistan's highest mountain?",["Nanga Parbat","K2","Rakaposhi","Tirich Mir"],1],
["Minar-e-Pakistan is in?",["Karachi","Lahore","Multan","Peshawar"],1]],
world:[
["Largest continent?",["Africa","Asia","Europe","Australia"],1],
["The Eiffel Tower is in?",["Rome","Paris","Madrid","Berlin"],1],
["Pyramids of Giza are in?",["Egypt","Greece","Mexico","India"],0],
["Currency of Japan?",["Yuan","Won","Yen","Rupee"],2],
["Smallest continent?",["Europe","Australia","Antarctica","South America"],1]]
};
function startQuiz(){
let list=quizzes[category]||quizzes.general,q=0,points=0;
$("gameTitle").textContent="🧠 "+category+" Quiz";
function show(){
if(q===list.length){finish(points,"Quiz completed!");return}
let item=list[(q+(level-1)*3)%list.length];
area.innerHTML="<h3>Question "+(q+1)+" of "+list.length+"</h3><h2>"+item[0]+"</h2>";
item[1].forEach((v,i)=>area.append(btn(String.fromCharCode(65+i)+". "+v,()=>{
if(roundDone)return;
if(i===item[2]){points+=10;status("Correct answer!")}else status("Correct answer: "+item[1][item[2]]);
q++;timer=setTimeout(show,500);
},"option")));
}
show();
}

/* FIND THE DIFFERENCE - tap directly on either picture */
function startDifference(){
intro("🔎 Find the Difference","Tap directly on the different objects in either picture. Find all five. No timer!");
let shapes=[[20,25,12],[75,25,10],[35,65,13],[72,72,12],[50,45,9]];
let found=[];
let colors=["#f7c66b","#70c5d8","#ed8a9b","#8cc98d","#ad9be9"];
let seed=(level*7)%5;
function svg(right){
let o="";
shapes.forEach((p,i)=>{
let x=p[0],y=p[1],r=p[2],c=colors[(i+seed)%5];
if(right&&i===0)c="#ffffff";
if(right&&i===1)x+=8;
if(right&&i===2)r-=5;
if(right&&i===3)y-=9;
if(right&&i===4)c="#30204b";
o+='<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+c+'" stroke="#34264d" stroke-width="2"/>';
});
return '<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="7" fill="#8bd2e8"/><rect y="65" width="100" height="35" fill="#75b87b"/><circle cx="83" cy="15" r="9" fill="#ffe17a"/><path d="M0 68L25 40L47 68L68 35L100 68" fill="#8b91b8"/>'+o+'</svg>';
}
area.innerHTML='<div class="diff-pictures"><div class="picture"><b>Picture A</b>'+svg(false)+'</div><div class="picture"><b>Picture B</b>'+svg(true)+'</div></div><p class="small">Found: <b id="diffCount">0 / 5</b>. Tap the changed object in either picture.</p>';
function tap(e){
if(roundDone)return;
let rect=e.currentTarget.getBoundingClientRect();
let x=(e.clientX-rect.left)/rect.width*100;
let y=(e.clientY-rect.top)/rect.width*100;
let best=-1,dist=999;
shapes.forEach((p,i)=>{
let dx=x-p[0],dy=y-p[1],d=Math.sqrt(dx*dx+dy*dy);
if(d<dist){dist=d;best=i}
});
if(dist<16){
if(found.includes(best)){status("You already found that difference.");return}
found.push(best);$("diffCount").textContent=found.length+" / 5";
let mark=document.createElement("div");mark.className="diff-mark";mark.style.left=shapes[best][0]+"%";mark.style.top=shapes[best][1]+"%";
e.currentTarget.append(mark);status("Great! Difference found.");
if(found.length===5)finish(25,"All five differences found!");
}else status("Not there. Look carefully and try again.");
}
document.querySelectorAll(".picture").forEach(p=>p.addEventListener("click",tap));
}

/* MATCH 3 - swaps, matches, gravity and refill */
function startMatch3(){
intro("🍬 Match-3 Puzzle","Select a tile, then an adjacent tile to swap. Match three or more. Complete the target before moves run out.");
const n=6,icons=["🍒","🍋","🍇","🍊","🍏","🫐"];
let board=[],moves=Math.max(12,20-Math.floor(level/15)),target=10+level%8,selectedTile=null;
function fresh(){board=Array.from({length:36},()=>Math.floor(Math.random()*6));}
function matches(){
let set=new Set();
for(let r=0;r<n;r++)for(let c=0;c<n;c++){
let i=r*n+c,v=board[i];
if(c+2<n&&board[i+1]===v&&board[i+2]===v){let x=c;while(x<n&&board[r*n+x]===v)set.add(r*n+x++);}
if(r+2<n&&board[i+n]===v&&board[i+2*n]===v){let x=r;while(x<n&&board[x*n+c]===v)set.add(x++*n+c);}
}
return [...set];
}
function settle(){
let m=matches(),guard=0;
while(m.length&&guard++<12){
target-=m.length;
m.forEach(i=>board[i]=-1);
for(let c=0;c<n;c++){
let vals=[];for(let r=n-1;r>=0;r--)if(board[r*n+c]!==-1)vals.push(board[r*n+c]);
for(let r=n-1;r>=0;r--)board[r*n+c]=vals[n-1-r]===undefined?Math.floor(Math.random()*6):vals[n-1-r];
}
m=matches();
}
}
function render(){
area.innerHTML='<div class="stats"><div class="stat">Moves: '+moves+'</div><div class="stat">Target: '+Math.max(0,target)+'</div></div><div class="grid" style="grid-template-columns:repeat(6,1fr);margin-top:12px" id="candyGrid"></div>';
board.forEach((v,i)=>{
let b=btn(icons[v],()=>tap(i),"candy secondary");if(i===selectedTile)b.classList.add("selected");$("candyGrid").append(b);
});
}
function tap(i){
if(roundDone)return;
if(selectedTile===null){selectedTile=i;render();return}
let a=selectedTile;selectedTile=null;
if(Math.abs(a-i)!==n&&!(Math.floor(a/n)===Math.floor(i/n)&&Math.abs(a-i)===1)){render();return}
[board[a],board[i]]=[board[i],board[a]];
let m=matches();
if(!m.length){[board[a],board[i]]=[board[i],board[a]];status("That swap did not make a match.");}
else{settle();moves--;status("Nice! Tiles matched and new candies fell into place.");}
if(target<=0){finish(30,"Puzzle target completed!");return}
if(moves<=0){retry("Out of moves. Try again!");return}
render();
}
fresh();settle();render();
}

/* CAR RACING - canvas car, road, traffic, coins */
function startRacing(){
intro("🏎️ Car Racing","Steer your car between lanes. Avoid traffic and collect gold coins. Use the buttons or tap left/right side of the road.");
area.innerHTML='<canvas id="raceCanvas" width="360" height="520"></canvas><div class="race-controls"><button class="secondary" id="leftBtn">⬅️</button><button class="secondary" id="rightBtn">➡️</button></div><p class="small" style="text-align:center">Coins: <b id="coins">0</b> · Distance: <b id="distance">0</b></p>';
let canvas=$("raceCanvas"),ctx=canvas.getContext("2d"),lane=1,objects=[],coins=0,distance=0,tick=0;
let speed=3+Math.min(3,level/30),running=true;
function move(d){lane=Math.max(0,Math.min(2,lane+d))}
$("leftBtn").onclick=()=>move(-1);$("rightBtn").onclick=()=>move(1);
canvas.addEventListener("pointerdown",e=>{let r=canvas.getBoundingClientRect();move(e.clientX<r.left+r.width/2?-1:1)});
function car(x,y,color){
ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,42,68,9);ctx.fill();
ctx.fillStyle="#bdeaff";ctx.fillRect(x+7,y+10,28,17);
ctx.fillStyle="#17112f";ctx.fillRect(x+4,y+4,7,12);ctx.fillRect(x+31,y+4,7,12);
ctx.fillStyle="#ffe88b";ctx.fillRect(x+5,y+55,8,7);ctx.fillRect(x+29,y+55,8,7);
}
function frame(){
if(!running)return;
ctx.clearRect(0,0,360,520);
ctx.fillStyle="#36764b";ctx.fillRect(0,0,360,520);
ctx.fillStyle="#3c3c49";ctx.fillRect(45,0,270,520);
ctx.fillStyle="#fff";for(let y=(tick*speed)%60-60;y<520;y+=60){ctx.fillRect(133,y,4,30);ctx.fillRect(223,y,4,30)}
tick++;distance++;
if(tick%Math.max(18,42-Math.floor(level/10))===0)objects.push({lane:Math.floor(Math.random()*3),y:-70,coin:Math.random()<.25});
objects.forEach(o=>{
o.y+=speed;
if(o.coin){ctx.fillStyle="#ffd34f";ctx.beginPath();ctx.arc(87+o.lane*90,o.y+25,13,0,Math.PI*2);ctx.fill();ctx.fillStyle="#8b5b00";ctx.font="bold 15px Arial";ctx.fillText("$",81+o.lane*90,o.y+30)}
else car(66+o.lane*90,o.y,"#d94b5c");
});
objects=objects.filter(o=>{
if(o.lane===lane&&o.y>390&&o.y<490){
if(o.coin){coins++;$("coins").textContent=coins;return false}
running=false;status("💥 Crash! Distance: "+distance);actions.innerHTML="";actions.append(btn("Try Again",startRacing));return false;
}
return o.y<560;
});
car(66+lane*90,430,"#42c8ff");
$("distance").textContent=distance;
if(distance>=Math.max(250,450-level*2)){running=false;finish(20+coins*2,"Race finished!");return}
if(running)raf=requestAnimationFrame(frame);
}
frame();
}

/* LUDO - local pass-and-play, dice, tokens, safe squares and captures */
function startLudo(){
intro("🎲 Ludo · Local Multiplayer","Pass the device between players. Roll a 6 to leave the yard. Move tokens around the track; capture opponents and reach home.");
area.innerHTML='<label class="small">Players</label><select id="players"><option value="2">2 Players</option><option value="3">3 Players</option><option value="4">4 Players</option></select><div class="ludo-board" id="ludoBoard"></div><p id="ludoInfo" style="text-align:center;font-weight:bold"></p><p class="small">Each player has four tokens. A 6 gives another turn. First player to bring all four tokens home wins.</p>';
let players=2,turn=0,dice=0;
const colors=["red","green","yellow","blue"],emojis=["🔴","🟢","🟡","🔵"];
let tokens=Array.from({length:4},()=>[0,0,0,0]);
const path=[3,4,5,12,19,26,33,32,31,30,29,28,21,14,7,8,9,16,23,30,37,36,35,34,27,20,13,6];
const safe=[0,7,14,21];
function draw(){
let b=$("ludoBoard");b.innerHTML="";
for(let i=0;i<49;i++){
let cell=document.createElement("div");cell.className="ludo-cell";
let row=Math.floor(i/7),col=i%7;
if(row<2&&col<2)cell.classList.add("red");
if(row<2&&col>4)cell.classList.add("green");
if(row>4&&col>4)cell.classList.add("yellow");
if(row>4&&col<2)cell.classList.add("blue");
let pos=path.indexOf(i),text="";
if(pos>=0){
cell.style.background="#fff2c9";
tokens.forEach((arr,p)=>arr.forEach((v,t)=>{if(v>0&&v<=28&&((v-1+p*7)%28)===pos)text+=emojis[p]}));
}
if(row>=2&&row<=4&&col>=2&&col<=4){cell.style.background="#d8c9ff";if(row===3&&col===3)text="🏠"}
cell.textContent=text||"";
b.append(cell);
}
$("ludoInfo").textContent="Player "+(turn+1)+" "+emojis[turn]+" · "+(dice?"Dice: "+dice:"Roll the dice");
}
function next(){turn=(turn+1)%players;dice=0;draw();actions.innerHTML="";actions.append(btn("🎲 Roll Dice",roll))}
function roll(){
if(roundDone)return;
dice=1+Math.floor(Math.random()*6);draw();status("Player "+(turn+1)+" rolled "+dice+". Choose a token.");
actions.innerHTML="";
let possible=tokens[turn].map((v,i)=>(v===0&&dice===6)||(v>0&&v<29&&v+dice<=29)?i:-1).filter(i=>i>=0);
if(!possible.length){actions.append(btn("No move - Next player",next));return}
possible.forEach(i=>actions.append(btn("Move token "+(i+1),()=>move(i),"secondary")));
}
function move(i){
let old=tokens[turn][i];tokens[turn][i]=old===0?1:old+dice;
let pos=(tokens[turn][i]-1+turn*7)%28;
if(!safe.includes(pos)){
tokens.forEach((arr,p)=>{if(p!==turn)arr.forEach((v,t)=>{if(v>0&&v<29&&(v-1+p*7)%28===pos)arr[t]=0})});
}
if(tokens[turn].every(v=>v===29)){finish(50,"Player "+(turn+1)+" wins!");return}
let again=dice===6;dice=0;draw();
if(again){status("Six! Player "+(turn+1)+" gets another turn.");actions.innerHTML="";actions.append(btn("Roll Again",roll))}
else next();
}
$("players").onchange=e=>{players=+e.target.value;turn=0;dice=0;tokens=Array.from({length:4},()=>[0,0,0,0]);draw();actions.innerHTML="";actions.append(btn("🎲 Roll Dice",roll))};
draw();actions.append(btn("🎲 Roll Dice",roll));
}

/* FLAGS */
function startFlags(){
intro("🏳️ Flag Challenge","Choose the country that matches the flag.");
let list=[["🇵🇰","Pakistan"],["🇯🇵","Japan"],["🇧🇷","Brazil"],["🇫🇷","France"],["🇹🇷","Turkey"],["🇬🇧","United Kingdom"],["🇨🇦","Canada"],["🇩🇪","Germany"]];
let q=list[(level-1)%list.length];area.innerHTML='<div style="font-size:75px;text-align:center">'+q[0]+'</div><h3>Which country does this flag belong to?</h3>';
list.slice().sort(()=>Math.random()-.5).slice(0,4).forEach(x=>area.append(btn(x[1],()=>x[1]===q[1]?finish(10,"Correct flag!"):retry("Correct answer: "+q[1]),"option")));
}

/* SCRAMBLE */
function startScramble(){
intro("🔤 Word Scramble","Unscramble the letters to make a correct word.");
let words=["APPLE","TRAIN","HOUSE","WATER","PLANET","GARDEN","ORANGE","MARKET","SCHOOL","FRIEND","PURPLE","POCKET"];
let word=words[(level-1)%words.length],mix=word.split("").sort(()=>Math.random()-.5).join("");
area.innerHTML="<h2 style='letter-spacing:8px;text-align:center'>"+mix+"</h2><input id='wordAnswer' placeholder='Type your answer'>";
actions.append(btn("Check Answer",()=> $("wordAnswer").value.trim().toUpperCase()===word?finish(10,"Correct word!"):retry("Not correct. Try again.")));
}

/* MATH */
function startMath(){
intro("➕ Math Sprint","Solve the calculation. Numbers increase with your level.");
let a=level%30+5,b=level%17+3,ans=a+b;
area.innerHTML="<h2 style='text-align:center;font-size:34px'>"+a+" + "+b+" = ?</h2>";
[ans,ans+1,ans-1,ans+3].sort(()=>Math.random()-.5).forEach(v=>area.append(btn(v,()=>v===ans?finish(10,"Correct calculation!"):retry("Correct answer: "+ans),"option")));
}

/* TRUE OR FALSE */
function startTrueFalse(){
intro("✔️ True or False","Read the statement and choose your answer.");
let qs=[["The Earth orbits the Sun.",true],["The Moon is a star.",false],["Water freezes at 0°C.",true],["Humans have three hearts.",false],["The Pacific is an ocean.",true]];
let q=qs[(level-1)%qs.length];area.innerHTML="<h2>"+q[0]+"</h2>";
["True","False"].forEach((v,i)=>area.append(btn(v,()=>((v==="True")===q[1])?finish(10,"Correct!"):retry("Incorrect answer."),"option")));
}

/* ODD ONE OUT */
function startOdd(){
intro("🧩 Odd One Out","Choose the item that does not belong.");
let qs=[["Apple · Mango · Banana · Car","Car"],["Dog · Cat · Cow · Rose","Rose"],["Red · Blue · Green · Table","Table"],["Bus · Train · Plane · Potato","Potato"]];
let q=qs[(level-1)%qs.length],parts=q[0].split(" · ");area.innerHTML="<h2>"+q[0]+"</h2>";
parts.sort(()=>Math.random()-.5).forEach(v=>area.append(btn(v,()=>v===q[1]?finish(10,"Well spotted!"):retry("Try another item."),"option")));
}

/* RIDDLE */
function startRiddle(){
intro("🤔 Riddle Challenge","Think carefully and choose the answer.");
let qs=[["What has keys but cannot open locks?",["Piano","Door","Map","Clock"],"Piano"],["What gets wetter as it dries?",["Towel","Sun","Paper","Soap"],"Towel"],["What has a face and two hands but no arms?",["Clock","Robot","Book","Tree"],"Clock"]];
let q=qs[(level-1)%qs.length];area.innerHTML="<h2>"+q[0]+"</h2>";
q[1].forEach(v=>area.append(btn(v,()=>v===q[2]?finish(10,"Correct riddle!"):retry("Not quite. Try again."),"option")));
}

/* EMOJI */
function startEmoji(){
intro("😀 Emoji Decode","Decode the emoji clue.");
let qs=[["🌞 + 🌻",["Sunflower","Sunset","Sunrise","Sun"],"Sunflower"],["🐝 + 🍯",["Honeybee","Honey","Bee house","Flower"],"Honey"],["🌧️ + 🌈",["Rainbow","Storm","Cloud","Raincoat"],"Rainbow"]];
let q=qs[(level-1)%qs.length];area.innerHTML="<h2 style='font-size:42px'>"+q[0]+"</h2>";
q[1].forEach(v=>area.append(btn(v,()=>v===q[2]?finish(10,"Decoded!"):retry("Try again."),"option")));
}

/* PICTURE HUNT */
function startHunt(){
intro("🔍 Picture Hunt","Find the different picture in the row.");
let sets=[["🍎","🍎","🍌","🍎"],["🐶","🐶","🐱","🐶"],["🚗","🚗","🚕","🚗"],["🌟","🌟","🌙","🌟"]];
let s=sets[(level-1)%sets.length],answer=s.find((v,i)=>s.indexOf(v)===i&&s.lastIndexOf(v)===i);
area.innerHTML='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px"></div>';
let g=area.firstChild;s.forEach(v=>g.append(btn(v,()=>v===answer?finish(10,"Found it!"):retry("That is not different."),"option")));
}

/* NUMBER SLIDE PUZZLE */
function startNumber(){
intro("🔢 Number Puzzle","Slide a tile into the empty space. Arrange numbers from 1 to 8.");
let board=[1,2,3,4,5,6,7,0,8];
for(let i=0;i<level%5;i++){let z=board.indexOf(0),opts=[z-3,z+3,z-1,z+1].filter(v=>v>=0&&v<9&&!(Math.abs(v-z)===1&&Math.floor(v/3)!==Math.floor(z/3)));let v=opts[Math.floor(Math.random()*opts.length)];[board[z],board[v]]=[board[v],board[z]]}
function render(){
area.innerHTML='<div class="number-grid" id="numberGrid"></div><p class="small">Tap a tile next to the empty space.</p>';
board.forEach((v,i)=>$("numberGrid").append(btn(v||" ",()=>move(i),"secondary")));
}
function move(i){
let z=board.indexOf(0);
if(Math.abs(i-z)!==3&&!(Math.abs(i-z)===1&&Math.floor(i/3)===Math.floor(z/3)))return;
[board[i],board[z]]=[board[z],board[i]];
if(board.join(",")==="1,2,3,4,5,6,7,8,0"){finish(20,"Puzzle solved!");return}render();
}
render();
}

/* MEMORY MATCH */
function startMemory(){
intro("🧠 Memory Match","Flip two cards. Find all matching pairs.");
let symbols=["🍎","🍋","🍇","⭐","🚗","🐱","⚽","🌙"],deck=symbols.slice(0,Math.min(4,3+Math.floor(level/10))).flatMap(x=>[x,x]).sort(()=>Math.random()-.5);
let open=[],matched=[],locked=false;
function render(){
area.innerHTML='<div class="memory-grid" id="memoryGrid"></div><p class="small">Pairs found: '+matched.length/2+' / '+symbols.slice(0,deck.length/2).length+'</p>';
deck.forEach((v,i)=>$("memoryGrid").append(btn(matched.includes(i)||open.includes(i)?v:"❔",()=>flip(i),"memory-card")));
}
function flip(i){
if(locked||matched.includes(i)||open.includes(i))return;
open.push(i);render();
if(open.length===2){
locked=true;
if(deck[open[0]]===deck[open[1]]){matched.push(...open);open=[];locked=false;render();if(matched.length===deck.length)finish(25,"All pairs matched!")}
else timer=setTimeout(()=>{open=[];locked=false;render()},800);
}
}
render();
}

/* WORD SEARCH */
function startWordSearch(){
intro("🔠 Word Search","Find the hidden word by tapping its letters in order.");
let words=["CAT","SUN","DOG","CAR","MAP","PEN","HAT","CUP"],word=words[(level-1)%words.length];
let letters=word.split("");while(letters.length<25)letters.push("ABCDEFGHIJKLMNOPQRSTUVWXYZ"[Math.floor(Math.random()*26)]);
letters.sort(()=>Math.random()-.5);
let chosen="";
area.innerHTML="<h3>Find this word: "+word+"</h3><p class='small'>Selected: <b id='selectedWord'></b></p><div class='letter-grid' id='letterGrid'></div>";
letters.forEach(v=>$("letterGrid").append(btn(v,()=>{chosen+=v;$("selectedWord").textContent=chosen;if(chosen===word)finish(15,"Word found!");else if(!word.startsWith(chosen)){status("Not that sequence. Start again.");chosen="";$("selectedWord").textContent=""}})));
actions.append(btn("Clear Selection",()=>{chosen="";$("selectedWord").textContent=""},"secondary"));
}

/* REACTION TEST */
function startReaction(){
intro("⚡ Reaction Test","Press Start. Wait for the green button, then tap as quickly as possible.");
let b=btn("Start",()=>{
b.disabled=true;b.textContent="Wait...";
let delay=1000+Math.random()*3000;
timer=setTimeout(()=>{let began=Date.now();b.disabled=false;b.textContent="TAP NOW!";b.className="green";b.onclick=()=>finish(Math.max(5,30-Math.floor((Date.now()-began)/100)),"Reaction time: "+(Date.now()-began)+" ms")},delay);
});
area.append(b);
}

/* SUDOKU - playable 4x4 */
function startSudoku(){
intro("🔢 Mini Sudoku","Fill the empty cells. Each row and column must contain 1, 2, 3 and 4 once.");
let solution=[[1,2,3,4],[3,4,1,2],[2,1,4,3],[4,3,2,1]],puzzle=solution.map(r=>r.slice());
let holes=[0,5,10,15];holes.forEach(i=>puzzle[Math.floor(i/4)][i%4]=0);
area.innerHTML='<div class="sudoku-grid" id="sudokuGrid"></div>';
puzzle.forEach((row,r)=>row.forEach((v,c)=>{
let inp=document.createElement("input");inp.maxLength=1;inp.inputMode="numeric";inp.value=v||"";inp.disabled=!!v;inp.dataset.r=r;inp.dataset.c=c;$("sudokuGrid").append(inp);
}));
actions.append(btn("Check Puzzle",()=>{
let inputs=[...$("sudokuGrid").querySelectorAll("input")];
let ok=inputs.every(x=>+x.value===solution[+x.dataset.r][+x.dataset.c]);
if(ok)finish(25,"Sudoku solved!");else status("Some cells are incorrect. Keep trying.");
}));
}

/* WORD GUESS */
function startGuess(){
intro("🔤 Word Guess","Guess the hidden word. Type your answer.");
let words=["PLANET","GARDEN","FRIEND","SCHOOL","ORANGE","POCKET"],word=words[(level-1)%words.length];
area.innerHTML="<h2>Hint: "+({PLANET:"A world in space",GARDEN:"A place with plants",FRIEND:"Someone you trust",SCHOOL:"A place to learn",ORANGE:"A fruit and a colour",POCKET:"A small cloth pouch"}[word])+"</h2><input id='guessInput' placeholder='Your guess'>";
actions.append(btn("Submit",()=> $("guessInput").value.trim().toUpperCase()===word?finish(15,"Correct word!"):retry("Not correct. Try again.")));
}

/* RESET */
window.resetCurrent=function(){
if(!confirm("Reset this game's saved score and level?"))return;
localStorage.removeItem(key);level=1;score=0;unlocked=1;start();
};
start();
})();
</script>
