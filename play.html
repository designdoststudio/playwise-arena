
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#100d20">
<meta name="robots" content="noindex,follow">
<title>Play a Game | PlayWise Arena</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#100d20;color:#f7f5ff;font-family:Arial,sans-serif}
body{overflow-x:hidden}
header{background:#1c1636;padding:12px;text-align:center;border-bottom:1px solid #392d60}
header a{color:#c8baff;text-decoration:none;font-size:14px}
header h1{font-size:21px;margin:7px 0 3px}
header p{margin:4px;color:#c4bddb;font-size:12px}
main{width:100%;max-width:900px;margin:auto;padding:8px}
.panel{background:#1c1732;border:1px solid #382e59;border-radius:14px;padding:12px;margin:8px 0}
#gameTitle{font-size:20px;font-weight:bold;margin-bottom:8px}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.stat{background:#30264b;border-radius:8px;padding:7px 9px;font-size:12px}
.levelbar{height:7px;background:#33294d;border-radius:20px;overflow:hidden;margin:9px 0}
.levelbar span{display:block;height:100%;background:#9b7cff}
.small{font-size:12px;color:#c7bfdc;line-height:1.5}
#status{color:#d4c9ff;font-weight:bold;margin:8px 0;min-height:20px;font-size:13px}
button,input,select{font:inherit}
button{border:0;border-radius:10px;padding:11px 13px;background:#7958ed;color:white;font-weight:bold;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4}
.secondary{background:#342a50;color:#eee}
.green{background:#16885e}
.option{display:block;width:100%;margin:7px 0;text-align:left;background:#30264b}
input,select{padding:11px;border-radius:9px;border:1px solid #594b78;background:#110d20;color:white;margin:5px 0;max-width:100%}
#gameArea{width:100%;min-width:0}
#actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
#actions button{min-height:43px}
.game-hud{display:flex;justify-content:space-between;gap:6px;max-width:100%;margin:8px auto;font-size:14px;font-weight:bold;flex-wrap:wrap}
footer{text-align:center;padding:18px;color:#aaa;font-size:11px}

/* MATCH 3 */
.match-wrap{width:100%;max-width:650px;margin:0 auto}
#matchBoard{width:100%;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:clamp(2px,1vw,6px);aspect-ratio:1/1;margin:10px auto;touch-action:none;user-select:none;-webkit-user-select:none}
.gem{width:100%;height:100%;min-width:0;min-height:0;padding:0;border-radius:clamp(5px,1.5vw,12px);font-size:clamp(20px,6.3vw,42px);display:flex;align-items:center;justify-content:center;line-height:1;user-select:none;-webkit-user-select:none;touch-action:none}
.gem.selected{outline:3px solid white;transform:scale(.91);filter:brightness(1.2)}
.gem.dragging{opacity:.55;transform:scale(.88)}
.match-help{text-align:center;margin:5px 0}

/* RACING */
#raceCanvas{display:block;width:100%;height:min(72vh,780px);min-height:480px;margin:auto;border-radius:12px;background:#333;touch-action:none}
.race-controls{display:flex;justify-content:center;gap:18px;margin:10px auto;max-width:600px}
.race-controls button{font-size:20px;min-width:42%;min-height:58px}

/* DIFFERENCE */
.diff-pictures{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.picture{min-width:0;background:#292044;border-radius:10px;padding:5px;position:relative;touch-action:manipulation}
.picture svg{width:100%;height:auto;display:block;border-radius:7px}
.diff-mark{position:absolute;width:25px;height:25px;border:3px solid #ffe15b;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}

/* LUDO */
.ludo-wrap{width:100%;max-width:650px;margin:10px auto}
.ludo-board{width:100%;height:auto;display:block;background:#f7f0df;border-radius:10px;touch-action:manipulation}
.ludo-actions{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin:10px}
.dice-face{font-size:40px;background:#fff;color:#17112f;border-radius:12px;width:62px;height:62px;display:grid;place-items:center}

/* OTHER GAMES */
.memory-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:600px;margin:auto}
.memory-card{aspect-ratio:1;font-size:clamp(22px,7vw,42px);padding:0;background:#342a50}
.letter-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;max-width:500px;margin:12px auto}
.letter-grid button{padding:13px 0;font-size:19px;background:#342a50}
.sudoku-grid{display:grid;grid-template-columns:repeat(4,1fr);max-width:400px;width:100%;margin:12px auto;border:2px solid #bca9ff;gap:2px}
.sudoku-grid input{width:100%;height:clamp(55px,14vw,75px);margin:0;text-align:center;font-size:24px;padding:0;border-radius:0}
.number-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:450px;width:100%;margin:12px auto}
.number-grid button{aspect-ratio:1;font-size:clamp(22px,6vw,34px)}
@media(min-width:700px){
 main{padding:12px}
 .panel{padding:16px}
}
@media(max-width:480px){
 main{padding:5px}
 .panel{padding:9px;border-radius:12px}
 #gameTitle{font-size:18px}
 .diff-pictures{gap:4px}
 #raceCanvas{height:68vh;min-height:460px}
 .game-hud{font-size:12px}
}
</style>
</head>
<body>
<header>
<a href="./">← PlayWise Arena Home</a>
<h1>🎮 PlayWise Arena</h1>
<p>Play, learn and challenge yourself!</p>
</header>
<main>
<section class="panel">
<div id="gameTitle">Loading game...</div>
<div class="stats">
<div class="stat">⭐ Score: <span id="score">0</span></div>
<div class="stat">🏆 Level: <span id="level">1</span></div>
<div class="stat">🔓 Unlocked: <span id="unlocked">1</span></div>
</div>
<div class="levelbar"><span id="progress" style="width:0%"></span></div>
<div class="small" id="difficulty"></div>
<div id="status">Get ready!</div>
</section>
<section class="panel">
<div id="gameArea"></div>
<div id="actions"></div>
</section>
<section class="panel">
<h3>🎯 Your Progress</h3>
<p class="small">Progress is saved in this browser on this device. Clearing browser data may erase it.</p>
<button class="secondary" onclick="resetCurrent()">Reset This Game</button>
<button class="secondary" onclick="location.href='./'">Back to Home</button>
</section>
</main>
<footer>PlayWise Arena · Created &amp; Managed by Muhammad Bilal</footer>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const area=$("gameArea"),actions=$("actions");
const params=new URLSearchParams(location.search);
const game=params.get("game")||"flags";
const type=params.get("type")||"game";
const category=params.get("category")||"general";
const names={difference:"Find the Difference",match3:"Match-3 Puzzle",racing:"Car Racing",ludo:"Ludo",flags:"Flag Challenge",scramble:"Word Scramble",math:"Math Sprint",truefalse:"True or False",odd:"Odd One Out",riddle:"Riddle Challenge",emoji:"Emoji Decode",hunt:"Picture Hunt",number:"Number Puzzle",memory:"Memory Match",wordsearch:"Word Search",reaction:"Reaction Test",sudoku:"Sudoku Challenge",guess:"Word Guess"};
const key="pwa_"+(type==="quiz"?"quiz_"+category:game);
let saved={};
try{saved=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){}
let level=Math.max(1,+saved.level||1);
let score=Math.max(0,+saved.score||0);
let unlocked=Math.max(level,+saved.unlocked||1);
let roundDone=false,timer=null,raf=null;

function save(){
 try{
 localStorage.setItem(key,JSON.stringify({level,score,unlocked}));
 let total=0;
 for(let i=0;i<localStorage.length;i++){
 let k=localStorage.key(i);
 if(k&&k.startsWith("pwa_")&&k!=="pwaScore"){
 try{total+=Math.max(0,+JSON.parse(localStorage.getItem(k)||"{}").score||0)}catch(e){}
 }
 }
 localStorage.setItem("pwaScore",String(total));
 }catch(e){}
}
function update(){
 $("score").textContent=score;
 $("level").textContent=level;
 $("unlocked").textContent=unlocked;
 $("difficulty").textContent="Difficulty: "+(level<10?"Beginner":level<30?"Easy":level<70?"Medium":level<150?"Hard":"Expert");
 $("progress").style.width=(level%10===0?100:level%10*10)+"%";
 save();
}
function status(t){$("status").textContent=t}
function btn(t,fn,cls=""){
 let b=document.createElement("button");
 b.textContent=t;b.className=cls;b.onclick=fn;return b;
}
function finish(points=10,msg="Level completed!"){
 if(roundDone)return;
 roundDone=true;score+=points;unlocked=Math.max(unlocked,level+1);
 status("🎉 "+msg+" +"+points+" points!");update();
 actions.innerHTML="";
 actions.append(btn("Next Level →",()=>{level++;roundDone=false;start()},"green"));
}
function retry(msg="Try again!"){
 status(msg);actions.innerHTML="";
 actions.append(btn("Try Again",start,"green"));
}
function intro(title,desc){
 $("gameTitle").textContent=title;
 area.innerHTML="<p class='small'>"+desc+"</p>";
 actions.innerHTML="";
}
function start(){
 if(raf){cancelAnimationFrame(raf);raf=null}
 if(timer){clearTimeout(timer);timer=null}
 roundDone=false;actions.innerHTML="";update();
 $("gameTitle").textContent="🎮 "+(names[game]||"Play a Game");
 if(type==="quiz"){startQuiz();return}
 const fn={difference:startDifference,match3:startMatch3,racing:startRacing,ludo:startLudo,flags:startFlags,scramble:startScramble,math:startMath,truefalse:startTrueFalse,odd:startOdd,riddle:startRiddle,emoji:startEmoji,hunt:startHunt,number:startNumber,memory:startMemory,wordsearch:startWordSearch,reaction:startReaction,sudoku:startSudoku,guess:startGuess}[game];
 if(fn)fn();else area.innerHTML="<p>Game not found. Return to homepage.</p>";
}

/* QUIZ */
const quizzes={
general:[["Which is the largest ocean?",["Pacific","Atlantic","Indian","Arctic"],0],["How many days are in a leap year?",["364","365","366","367"],2],["Which planet is called the Red Planet?",["Venus","Mars","Jupiter","Saturn"],1],["What is the capital of Japan?",["Seoul","Tokyo","Beijing","Bangkok"],1],["How many sides has a hexagon?",["5","6","7","8"],1]],
science:[["Which gas do plants absorb?",["Oxygen","Carbon dioxide","Nitrogen","Hydrogen"],1],["What is H2O?",["Salt","Water","Oxygen","Sugar"],1],["Which organ pumps blood?",["Lungs","Brain","Heart","Liver"],2],["Earth's natural satellite?",["Sun","Moon","Mars","Venus"],1],["Which force pulls objects down?",["Magnetism","Gravity","Friction","Light"],1]],
sports:[["Players on a football team on the field?",["9","10","11","12"],2],["Which sport uses a shuttlecock?",["Tennis","Badminton","Hockey","Cricket"],1],["A cricket boundary over the rope scores?",["2","3","4","6"],2],["Wimbledon is associated with?",["Tennis","Football","Golf","Rugby"],0],["Olympic symbol has how many rings?",["4","5","6","7"],1]],
pakistan:[["Capital of Pakistan?",["Lahore","Karachi","Islamabad","Quetta"],2],["Pakistan became independent in?",["1940","1947","1956","1965"],1],["National language of Pakistan?",["Punjabi","Urdu","Sindhi","Pashto"],1],["Pakistan's highest mountain?",["Nanga Parbat","K2","Rakaposhi","Tirich Mir"],1],["Minar-e-Pakistan is in?",["Karachi","Lahore","Multan","Peshawar"],1]],
world:[["Largest continent?",["Africa","Asia","Europe","Australia"],1],["The Eiffel Tower is in?",["Rome","Paris","Madrid","Berlin"],1],["Pyramids of Giza are in?",["Egypt","Greece","Mexico","India"],0],["Currency of Japan?",["Yuan","Won","Yen","Rupee"],2],["Smallest continent?",["Europe","Australia","Antarctica","South America"],1]]
};
function startQuiz(){
 let list=quizzes[category]||quizzes.general,q=0,points=0;
 $("gameTitle").textContent="🧠 "+category+" Quiz";
 function show(){
  if(q===list.length){finish(points,"Quiz completed!");return}
  let item=list[(q+(level-1)*3)%list.length];
  area.innerHTML="<h3>Question "+(q+1)+" of "+list.length+"</h3><h2>"+item[0]+"</h2>";
  item[1].forEach((v,i)=>area.append(btn(String.fromCharCode(65+i)+". "+v,()=>{
   if(roundDone)return;
   if(i===item[2])points+=10;else status("Correct answer: "+item[1][item[2]]);
   q++;timer=setTimeout(show,450);
  },"option")));
 }
 show();
}

/* MATCH 3 - MOBILE DRAG + TAP */
function startMatch3(){
 intro("💎 Match-3 Puzzle","Finger se gem ko pakrein aur side walay gem par chhor dein. Ya pehle gem aur phir neighbour ko tap karein. 3 ya zyada same gems match karein.");
 const n=8,icons=["🍒","🍋","🍇","🍊","🍏","🫐"],cols=["#d94f70","#e5b94d","#9b70d6","#e98c43","#65b978","#559ed6"];
 let board=[],moves=Math.max(18,25-Math.floor(level/12)),target=25+(level%8),selected=null,dragStart=null,dragPointer=null;
 function rand(){return Math.floor(Math.random()*6)}
 function findMatches(){
  let s=new Set();
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
   let v=board[r*n+c];if(v<0)continue;
   let len=1;while(c+len<n&&board[r*n+c+len]===v)len++;
   if(len>=3)for(let k=0;k<len;k++)s.add(r*n+c+k);
   len=1;while(r+len<n&&board[(r+len)*n+c]===v)len++;
   if(len>=3)for(let k=0;k<len;k++)s.add((r+k)*n+c);
  }
  return [...s];
 }
 function collapse(){
  let m=findMatches(),guard=0;
  while(m.length&&guard++<30){
   target-=m.length;m.forEach(i=>board[i]=-1);
   for(let c=0;c<n;c++){
    let vals=[];
    for(let r=n-1;r>=0;r--)if(board[r*n+c]!==-1)vals.push(board[r*n+c]);
    for(let r=n-1;r>=0;r--)board[r*n+c]=vals[n-1-r]===undefined?rand():vals[n-1-r];
   }
   m=findMatches();
  }
 }
 function adjacent(a,b){
  return Math.abs(a-b)===n||(Math.floor(a/n)===Math.floor(b/n)&&Math.abs(a-b)===1);
 }
 function render(){
  area.innerHTML='<div class="match-wrap"><div class="game-hud"><span>Moves: '+moves+'</span><span>Target: '+Math.max(0,target)+'</span><span>Level '+level+'</span></div><div id="matchBoard"></div><p class="small match-help">Drag one gem onto a neighbour. Tap controls also work.</p></div>';
  let g=$("matchBoard");
  board.forEach((v,i)=>{
   let b=document.createElement("button");
   b.type="button";b.className="gem";b.textContent=icons[v];b.style.background=cols[v];b.dataset.i=i;
   if(i===selected)b.classList.add("selected");
   g.append(b);
  });
  // Pointer events are handled by the whole board, not individual gems.
  // This avoids mobile pointer-capture and touch/click conflicts.
  g.addEventListener("pointerdown",e=>{
   let gem=e.target.closest(".gem");if(!gem||roundDone)return;
   dragStart=Number(gem.dataset.i);dragPointer=e.pointerId;
   gem.classList.add("dragging");
   try{g.setPointerCapture(e.pointerId)}catch(err){}
   e.preventDefault();
  });
  g.addEventListener("pointerup",e=>{
   if(dragStart===null||dragPointer!==e.pointerId)return;
   let from=dragStart,rect=g.getBoundingClientRect();
   let col=Math.floor((e.clientX-rect.left)/(rect.width/n));
   let row=Math.floor((e.clientY-rect.top)/(rect.height/n));
   let to=(row>=0&&row<n&&col>=0&&col<n)?row*n+col:-1;
   dragStart=null;dragPointer=null;
   if(to>=0&&to!==from)swap(from,to);
   else{selected=from;render()}
   e.preventDefault();
  });
  g.addEventListener("pointercancel",()=>{
   dragStart=null;dragPointer=null;render();
  });
  // Tap-to-select works on devices where drag is not convenient.
  g.addEventListener("click",e=>{
   let gem=e.target.closest(".gem");if(!gem||roundDone)return;
   // Ignore the synthetic click generated after a drag.
   if(g.dataset.dragged==="1"){g.dataset.dragged="0";return}
   tap(Number(gem.dataset.i));
  });
 }
 function tap(i){
  if(roundDone)return;
  if(selected===null){selected=i;render();return}
  let a=selected;selected=null;
  if(a===i){render();return}
  if(adjacent(a,i))swap(a,i);
  else{selected=i;render()}
 }
 function swap(a,b){
  if(roundDone||!adjacent(a,b))return;
  [board[a],board[b]]=[board[b],board[a]];
  if(!findMatches().length){
   [board[a],board[b]]=[board[b],board[a]];
   selected=null;status("Invalid move. Make a line of 3 matching gems.");render();return;
  }
  moves--;collapse();selected=null;
  status("Great match! New gems have appeared.");
  if(target<=0){finish(35,"Target reached!");return}
  if(moves<=0){retry("No moves left. Try again!");return}
  render();
 }
 board=Array.from({length:n*n},rand);
 let guard=0;
 while(findMatches().length&&guard++<100)findMatches().forEach(i=>board[i]=rand());
 render();
}

/* RACING */
function startRacing(){
 intro("🏎️ Car Racing","Road par traffic se bachein aur coins collect karein. Neeche steering buttons ya road par swipe karein.");
 area.innerHTML='<div class="game-hud"><span>🪙 <b id="coins">0</b></span><span>Distance: <b id="distance">0</b></span><span>Best: <b id="best">0</b></span></div><canvas id="raceCanvas" width="480" height="720"></canvas><div class="race-controls"><button class="secondary" id="leftBtn">⬅ LEFT</button><button class="secondary" id="rightBtn">RIGHT ➡</button></div><p class="small" style="text-align:center">Red cars se bachein aur gold coins collect karein.</p>';
 let canvas=$("raceCanvas"),ctx=canvas.getContext("2d"),lane=1,objects=[],coins=0,distance=0,tick=0,running=true,last=0,roadOffset=0;
 let best=+(localStorage.getItem("pwa_race_best")||0);$("best").textContent=best;
 let speed=5+Math.min(4,level*.08),goal=500+level*35;
 function steer(d){lane=Math.max(0,Math.min(2,lane+d))}
 $("leftBtn").onclick=()=>steer(-1);$("rightBtn").onclick=()=>steer(1);
 let sx=0;
 canvas.addEventListener("pointerdown",e=>{sx=e.clientX;e.preventDefault()});
 canvas.addEventListener("pointerup",e=>{let dx=e.clientX-sx;if(Math.abs(dx)>18)steer(dx>0?1:-1);else steer(e.clientX>canvas.getBoundingClientRect().left+canvas.getBoundingClientRect().width/2?1:-1)});
 function rounded(x,y,w,h,r,color){
  ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.fill();
 }
 function car(x,y,color){
  ctx.save();ctx.translate(x,y);rounded(-24,-43,48,86,12,"#15131b");rounded(-20,-42,40,82,10,color);
  rounded(-15,-25,30,23,6,"#b9d6e8");rounded(-15,8,30,15,4,"#24344b");
  ctx.fillStyle="#fff2b0";ctx.fillRect(-17,-38,9,5);ctx.fillRect(8,-38,9,5);
  ctx.fillStyle="#e43f55";ctx.fillRect(-17,33,9,6);ctx.fillRect(8,33,9,6);
  ctx.fillStyle="#111";ctx.fillRect(-27,-25,5,18);ctx.fillRect(22,-25,5,18);ctx.fillRect(-27,17,5,18);ctx.fillRect(22,17,5,18);ctx.restore();
 }
 function frame(ts){
  if(!running)return;
  let dt=Math.min(2,(ts-last)/16.67||1);last=ts;
  let w=480,h=720,roadX=45,roadW=390,laneW=roadW/3;
  ctx.clearRect(0,0,w,h);ctx.fillStyle="#397b4b";ctx.fillRect(0,0,w,h);
  ctx.fillStyle="#373945";ctx.fillRect(roadX,0,roadW,h);
  ctx.fillStyle="#d9d9df";ctx.fillRect(roadX,0,7,h);ctx.fillRect(roadX+roadW-7,0,7,h);
  roadOffset=(roadOffset+speed*dt)%90;ctx.fillStyle="#f4f0d8";
  for(let y=-90+roadOffset;y<h;y+=90){ctx.fillRect(roadX+laneW-3,y,6,48);ctx.fillRect(roadX+laneW*2-3,y,6,48)}
  tick+=dt;distance+=dt*1.1;$("distance").textContent=Math.floor(distance);
  if(tick>Math.max(28,65-level*.7)){tick=0;objects.push({lane:Math.floor(Math.random()*3),y:-70,coin:Math.random()<.28})}
  objects.forEach(o=>{
   o.y+=speed*dt;
   let x=roadX+laneW*(o.lane+.5);
   if(o.coin){ctx.fillStyle="#ffcf39";ctx.beginPath();ctx.arc(x,o.y,17,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff2a6";ctx.lineWidth=4;ctx.stroke();ctx.fillStyle="#865500";ctx.font="bold 19px Arial";ctx.textAlign="center";ctx.fillText("$",x,o.y+7)}
   else car(x,o.y,"#e14e61");
  });
  let px=roadX+laneW*(lane+.5),py=h-110;car(px,py,"#28b9f4");
  let hit=false;
  objects=objects.filter(o=>{
   if(o.lane===lane&&Math.abs(o.y-py)<66){
    if(o.coin){coins++;$("coins").textContent=coins;return false}else hit=true;
   }
   return o.y<h+80;
  });
  if(hit){running=false;best=Math.max(best,Math.floor(distance));localStorage.setItem("pwa_race_best",best);status("💥 Crash! Distance: "+Math.floor(distance));actions.innerHTML="";actions.append(btn("Race Again",startRacing,"green"));return}
  if(distance>=goal){running=false;best=Math.max(best,Math.floor(distance));localStorage.setItem("pwa_race_best",best);finish(30+coins*3,"Race completed!");return}
  raf=requestAnimationFrame(frame);
 }
 raf=requestAnimationFrame(frame);
}

/* FIND THE DIFFERENCE */
function startDifference(){
 intro("🔎 Find the Difference","Dono pictures compare karein aur 5 changed details par tap karein.");
 const scenes=[

 {title:"Beach Day",bg:"#82d7ef",ground:"#f3d18a",sky:'<circle cx="250" cy="45" r="23" fill="#ffdf65"/><path d="M0 135Q70 115 140 140T300 135V220H0" fill="#3eadd1"/>',items:[['<path d="M35 160L75 70 115 160Z" fill="#e95d5d"/>','<path d="M75 70V160" stroke="#fff" stroke-width="4"/>'],['<path d="M145 170Q165 110 185 170" fill="none" stroke="#9b633f" stroke-width="8"/>','<path d="M165 130V175" stroke="#9b633f" stroke-width="5"/>'],['<circle cx="235" cy="160" r="22" fill="#f6c85f"/>','<circle cx="235" cy="160" r="10" fill="#fff"/>'],['<path d="M10 205Q80 190 150 205T300 205" fill="none" stroke="#fff" stroke-width="5"/>','<path d="M10 205Q80 190 150 205T300 205" fill="none" stroke="#e1f7ff" stroke-width="2"/>'],['<path d="M260 90L275 70 290 90" fill="none" stroke="#333" stroke-width="4"/>','<path d="M260 90L275 65 290 90" fill="none" stroke="#333" stroke-width="4"/>']]},
 {title:"Waterfall Park",bg:"#b9e7f3",ground:"#6cae6d",sky:'<path d="M0 90L70 25 130 90 210 20 300 90" fill="#7891a5"/><path d="M130 70V175" stroke="#d9f8ff" stroke-width="35"/>',items:[['<rect x="25" y="125" width="35" height="70" fill="#8a573a"/>','<circle cx="42" cy="115" r="28" fill="#36844e"/>'],['<ellipse cx="205" cy="180" rx="70" ry="20" fill="#319ac1"/>','<path d="M145 180Q205 150 265 180" fill="none" stroke="#d8f8ff" stroke-width="5"/>'],['<circle cx="90" cy="65" r="18" fill="#ffe37a"/>','<circle cx="90" cy="65" r="11" fill="#ffe37a"/>'],['<path d="M250 130L270 95 290 130" fill="#6d8053"/>','<path d="M250 130L270 85 290 130" fill="#6d8053"/>'],['<path d="M0 210H300" stroke="#d9f3aa" stroke-width="8"/>','<path d="M0 210H300" stroke="#fff" stroke-width="3"/>']]}
 ];
 const scene=scenes[(level-1)%scenes.length],found=new Set();
 function picture(which){
  let s='<svg viewBox="0 0 300 220"><rect width="300" height="220" fill="'+scene.bg+'"/>'+scene.sky+'<rect y="185" width="300" height="35" fill="'+scene.ground+'"/>';
  scene.items.forEach(it=>s+=it[0]+it[1]);
  const a=['<circle cx="150" cy="95" r="12" fill="#ffe16a"/>','<rect x="48" y="133" width="24" height="27" rx="3" fill="#7ed6ee" stroke="#fff" stroke-width="3"/>','<circle cx="150" cy="165" r="13" fill="#e95e7d"/>','<path d="M226 145Q240 125 254 145Q240 162 226 145" fill="#fff"/>','<path d="M258 204l7 -12 7 12 12 -3 -7 11 7 8h-35l5 -8 -7 -8z" fill="#f5d65c"/>'];
  const b=['<circle cx="150" cy="95" r="12" fill="#ff7d52"/>','<rect x="48" y="133" width="24" height="27" rx="3" fill="#f4d16b" stroke="#fff" stroke-width="3"/>','<circle cx="150" cy="165" r="13" fill="#5c9ee8"/>','<path d="M226 145Q240 125 254 145Q240 162 226 145" fill="#ffcf54"/>','<path d="M258 204l7 -12 7 12 12 -3 -7 11 7 8h-35l5 -8 -7 -8z" fill="#e85c8b"/>'];
  s+=(which===0?a:b).join("");return s+"</svg>";
 }
 area.innerHTML='<h3 style="text-align:center">'+scene.title+'</h3><div class="diff-pictures"><div class="picture" data-side="0"><b>Picture A</b>'+picture(0)+'</div><div class="picture" data-side="1"><b>Picture B</b>'+picture(1)+'</div></div><p class="small">Differences found: <b id="diffCount">0 / 5</b></p>';
 const targets=[{x:150,y:95},{x:60,y:145},{x:150,y:165},{x:240,y:145},{x:270,y:205}];
 document.querySelectorAll(".picture").forEach(pic=>pic.addEventListener("click",e=>{
  if(roundDone)return;
  let r=pic.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*300,y=(e.clientY-r.top)/r.width*220,best=-1,d=999;
  targets.forEach((p,i)=>{let z=Math.hypot(x-p.x,y-p.y);if(z<d){d=z;best=i}});
  if(d<32){
   if(found.has(best)){status("Already found. Find another.");return}
   found.add(best);
   let m=document.createElement("div");m.className="diff-mark";m.style.left=targets[best].x/300*100+"%";m.style.top=targets[best].y/220*100+"%";pic.append(m);

 }));

/* LUDO - SIMPLE LOCAL BOARD */
function startLudo(){
 intro("🎲 Ludo · Local Multiplayer","2–4 players. Dice roll karein, 6 par token bahar nikalein, phir apna token select karke move karein.");
 area.innerHTML='<div style="text-align:center"><label class="small">Players: </label><select id="players"><option value="2">2 Players</option><option value="3">3 Players</option><option value="4" selected>4 Players</option></select></div><div class="ludo-wrap"><canvas id="ludoCanvas" class="ludo-board" width="600" height="600"></canvas></div><div class="ludo-actions"><div class="dice-face" id="diceFace">🎲</div><button id="rollDice">Roll Dice</button></div><p id="ludoInfo" style="text-align:center;font-weight:bold"></p>';
 const cv=$("ludoCanvas"),cx=cv.getContext("2d"),cell=40,C=["#e84c4c","#35a96b","#e6b83f","#4289d5"],pn=["Red","Green","Yellow","Blue"];
 const path=[[6,1],[6,2],[6,3],[6,4],[6,5],[5,6],[4,6],[3,6],[2,6],[1,6],[0,6],[0,7],[0,8],[1,8],[2,8],[3,8],[4,8],[5,8],[6,9],[6,10],[6,11],[6,12],[6,13],[7,14],[8,13],[8,12],[8,11],[8,10],[8,9],[9,8],[10,8],[11,8],[12,8],[13,8],[14,8],[14,7],[14,6],[13,6],[12,6],[11,6],[10,6],[9,6],[8,5],[8,4],[8,3],[8,2],[8,1],[7,0],[6,0],[5,0],[4,0],[3,0]];
 const startIdx=[0,13,26,39],safe=[0,8,13,21,26,34,39,47];
 const yards=[{r:0,c:0},{r:0,c:9},{r:9,c:9},{r:9,c:0}];
 let players=4,turn=0,dice=0,steps=Array.from({length:4},()=>[-1,-1,-1,-1]),movable=[];
 function draw(){
  cx.clearRect(0,0,600,600);cx.fillStyle="#fff";cx.fillRect(0,0,600,600);
  yards.forEach((q,p)=>{
   cx.fillStyle=C[p];cx.fillRect(q.c*cell,q.r*cell,6*cell,6*cell);
   cx.fillStyle="#fff";cx.fillRect((q.c+1)*cell,(q.r+1)*cell,4*cell,4*cell);
   for(let t=0;t<4;t++){let x=(q.c+(t%2?4:2)+.5)*cell,y=(q.r+(t>1?4:2)+.5)*cell;cx.beginPath();cx.arc(x,y,14,0,Math.PI*2);cx.fillStyle=C[p];cx.fill();cx.strokeStyle="#333";cx.stroke()}
  });
  path.forEach((p,i)=>{cx.fillStyle="#f8f4e9";cx.fillRect(p[1]*cell,p[0]*cell,cell,cell);cx.strokeStyle="#aaa";cx.strokeRect(p[1]*cell,p[0]*cell,cell,cell);if(safe.includes(i)){cx.fillStyle="#e5c85d";cx.beginPath();cx.arc((p[1]+.5)*cell,(p[0]+.5)*cell,7,0,Math.PI*2);cx.fill()}});
  cx.fillStyle="#eee";cx.fillRect(240,240,120,120);
  [[C[0],240,240,300,240,300,300],[C[1],300,240,360,240,300,300],[C[2],360,300,360,360,300,300],[C[3],240,360,300,360,300,300]].forEach(a=>{cx.fillStyle=a[0];cx.beginPath();cx.moveTo(a[1],a[2]);cx.lineTo(a[3],a[4]);cx.lineTo(a[5],a[6]);cx.fill()});
  steps.forEach((arr,p)=>arr.forEach((v,t)=>{
   let x,y;
   if(v<0){let q=yards[p];x=(q.c+(t%2?4:2)+.5)*cell;y=(q.r+(t>1?4:2)+.5)*cell}
   else{let q=path[(startIdx[p]+Math.min(v,51))%52];x=(q[1]+.5)*cell;y=(q[0]+.5)*cell}
   cx.beginPath();cx.arc(x,y,13,0,Math.PI*2);cx.fillStyle=C[p];cx.fill();cx.strokeStyle=movable.includes(t)&&p===turn?"#fff":"#27202f";cx.lineWidth=movable.includes(t)&&p===turn?5:2;cx.stroke();cx.fillStyle="#fff";cx.font="bold 12px Arial";cx.textAlign="center";cx.textBaseline="middle";cx.fillText(String(t+1),x,y);
  }));
  $("ludoInfo").textContent=pn[turn]+" player's turn"+(dice?" · Dice: "+dice:" · Roll the dice");
 }
 function getMovable(){return steps[turn].map((v,i)=>(v===-1&&dice===6)||(v>=0&&v<57&&v+dice<=57)?i:-1).filter(x=>x>=0)}
 function endTurn(extra){dice=0;movable=[];if(!extra)turn=(turn+1)%players;$("rollDice").disabled=false;draw()}
 function roll(){
  if(dice||roundDone)return;
  $("rollDice").disabled=true;
  let count=0,spin=setInterval(()=>{
   $("diceFace").textContent=["⚀","⚁","⚂","⚃","⚄","⚅"][Math.floor(Math.random()*6)];
   if(++count>8){
    clearInterval(spin);dice=1+Math.floor(Math.random()*6);
    $("diceFace").textContent=["⚀","⚁","⚂","⚃","⚄","⚅"][dice-1];
    movable=getMovable();draw();
    if(!movable.length){status("No valid move. Turn passes.");setTimeout(()=>endTurn(false),700)}
    else status("Tap one of your movable tokens.");
   }
  },90);
 }
 function moveToken(t){
  if(!movable.includes(t)||!dice)return;
  let v=steps[turn][t];steps[turn][t]=v===-1?0:v+dice;
  let pos=(startIdx[turn]+steps[turn][t])%52;
  if(!safe.includes(pos)){
   for(let op=0;op<players;op++)if(op!==turn)steps[op].forEach((ov,ot)=>{if(ov>=0&&ov<52&&(startIdx[op]+ov)%52===pos)steps[op][ot]=-1});
  }
  if(steps[turn].every(x=>x===57)){finish(60,pn[turn]+" player wins!");return}
  let six=dice===6;status("Token moved.");endTurn(six);
 }
 cv.addEventListener("click",e=>{
  if(!dice||!movable.length)return;
  let r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*600,y=(e.clientY-r.top)/r.height*600,best=-1,dist=999;
  steps[turn].forEach((v,t)=>{
   let xx,yy;
   if(v<0){let q=yards[turn];xx=(q.c+(t%2?4:2)+.5)*cell;yy=(q.r+(t>1?4:2)+.5)*cell}
   else{let q=path[(startIdx[turn]+Math.min(v,51))%52];xx=(q[1]+.5)*cell;yy=(q[0]+.5)*cell}
   let d=Math.hypot(x-xx,y-yy);if(d<dist){dist=d;best=t}
  });
  if(best>=0&&dist<35)moveToken(best);
 });
 $("rollDice").onclick=roll;
 $("players").onchange=e=>{players=+e.target.value;turn=0;dice=0;steps=Array.from({length:4},()=>[-1,-1,-1,-1]);movable=[];$("rollDice").disabled=false;draw()};
 draw();
}

function startNumber(){
 intro("🔢 Number Puzzle","Slide tiles into the empty space. Arrange 1 to 8.");
 let b=[1,2,3,4,5,6,7,0,8];
 for(let z=0;z<level%8+4;z++){
  let e=b.indexOf(0),opts=[e-3,e+3,e-1,e+1].filter(v=>v>=0&&v<9&&!(Math.abs(v-e)===1&&Math.floor(v/3)!==Math.floor(e/3)));
  let v=opts[Math.floor(Math.random()*opts.length)];[b[e],b[v]]=[b[v],b[e]];
 }
 function draw(){
  area.innerHTML='<div class="number-grid" id="numberGrid"></div>';
  b.forEach((v,i)=>$("numberGrid").append(btn(v||" ",()=>{
   let e=b.indexOf(0);

   [b[i],b[e]]=[b[e],b[i]];

  },"secondary")));
 }

function startMemory(){
 intro("🧠 Memory Match","Flip two cards and find matching pairs.");
 let s=["🍎","🍋","🍇","⭐","🚗","🐱","⚽","🌙"].slice(0,Math.min(8,4+Math.floor(level/8))),d=s.concat(s).sort(()=>Math.random()-.5),open=[],matched=[],lock=false;
 function draw(){
  area.innerHTML='<div class="memory-grid" id="memoryGrid"></div><p class="small">Pairs: '+matched.length/2+' / '+s.length+'</p>';
  d.forEach((v,i)=>$("memoryGrid").append(btn(matched.includes(i)||open.includes(i)?v:"❔",()=>flip(i),"memory-card")));
 }
 function flip(i){
  if(lock||matched.includes(i)||open.includes(i))return;
  open.push(i);draw();
  if(open.length===2){
   lock=true;
   if(d[open[0]]===d[open[1]]){
    matched.push(...open);open=[];lock=false;draw();
    if(matched.length===d.length)finish(25,"All pairs matched!");
   }else timer=setTimeout(()=>{open=[];lock=false;draw()},750);
  }
 }
 draw();
}
