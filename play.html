<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const game=params.get("game")||"flags";
const type=params.get("type")||"game";
const category=params.get("category")||"general";
const area=$("gameArea"),actions=$("actions");
const names={
difference:"Find the Difference",match3:"Candy Match Puzzle",
racing:"Car Racing",ludo:"Ludo",flags:"Flag Challenge",
scramble:"Word Scramble",math:"Math Sprint",truefalse:"True or False",
odd:"Odd One Out",riddle:"Riddle Challenge",emoji:"Emoji Decode",
hunt:"Picture Hunt",number:"Number Puzzle",memory:"Memory Match",
wordsearch:"Word Search",reaction:"Reaction Test",
sudoku:"Sudoku Challenge",guess:"Word Guess"
};
const key="pwa_"+(type==="quiz"?"quiz_"+category:game);
let saved={};
try{saved=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){}
let level=Math.max(1,+saved.level||1);
let score=Math.max(0,+saved.score||0);
let unlocked=Math.max(level,+saved.unlocked||1);
let timer=null,raf=null,roundDone=false;
function save(){
 try{
 localStorage.setItem(key,JSON.stringify({level,score,unlocked}));
 }catch(e){}
}
function update(){
 $("score").textContent=score;
 $("level").textContent=level;
 $("unlocked").textContent=unlocked;
 save();
}
function status(t){$("status").textContent=t}
function button(t,fn,cls=""){
 let b=document.createElement("button");
 b.textContent=t;b.className=cls;b.onclick=fn;
 return b;
}
function finish(points=10,msg="Level completed!"){
 if(roundDone)return;
 roundDone=true;score+=points;
 unlocked=Math.max(unlocked,level+1);
 status("🎉 "+msg+" +"+points+" points");
 update();actions.innerHTML="";
 actions.append(button("Next Level →",()=>{level++;start()},"green"));
}
function retry(msg){
 status(msg||"Try again!");
 actions.innerHTML="";
 actions.append(button("Try Again",start,"green"));
}
function intro(title,desc){
 $("gameTitle").textContent=title;
 area.innerHTML="<p class='small'>"+desc+"</p>";
 actions.innerHTML="";
}
function start(){
 if(timer){clearTimeout(timer);timer=null}
 if(raf){cancelAnimationFrame(raf);raf=null}
 roundDone=false;actions.innerHTML="";update();
 $("gameTitle").textContent="🎮 "+(names[game]||"Play a Game");
 if(type==="quiz"){startQuiz();return}
 const games={
 difference:startDifference,match3:startMatch3,racing:startRacing,
 ludo:startLudo,flags:startFlags,scramble:startScramble,math:startMath,
 truefalse:startTrueFalse,odd:startOdd,riddle:startRiddle,
 emoji:startEmoji,hunt:startHunt,number:startNumber,memory:startMemory,
 wordsearch:startWordSearch,reaction:startReaction,sudoku:startSudoku,
 guess:startGuess
 };
 if(games[game])games[game]();
 else area.textContent="Game not found.";
}

/* QUIZZES */
const quizzes={
general:[
["Which is the largest ocean?",["Pacific","Atlantic","Indian","Arctic"],0],
["How many days are in a leap year?",["364","365","366","367"],2],
["Which planet is called the Red Planet?",["Venus","Mars","Jupiter","Saturn"],1],

["How many sides has a hexagon?",["5","6","7","8"],1]],
science:[
["Which gas do plants absorb?",["Oxygen","Carbon dioxide","Nitrogen","Hydrogen"],1],
["What is H2O?",["Salt","Water","Oxygen","Sugar"],1],
["Which organ pumps blood?",["Lungs","Brain","Heart","Liver"],2],
["Earth's natural satellite?",["Sun","Moon","Mars","Venus"],1],
["Which force pulls objects down?",["Magnetism","Gravity","Friction","Light"],1]],
sports:[
["Players on a football team on the field?",["9","10","11","12"],2],
["Which sport uses a shuttlecock?",["Tennis","Badminton","Hockey","Cricket"],1],
["A cricket boundary over the rope scores?",["2","3","4","6"],2],
["Wimbledon is associated with?",["Tennis","Football","Golf","Rugby"],0],
["Olympic symbol has how many rings?",["4","5","6","7"],1]],
pakistan:[
["Capital of Pakistan?",["Lahore","Karachi","Islamabad","Quetta"],2],
["Pakistan became independent in?",["1940","1947","1956","1965"],1],
["National language of Pakistan?",["Punjabi","Urdu","Sindhi","Pashto"],1],
["Pakistan's highest mountain?",["Nanga Parbat","K2","Rakaposhi","Tirich Mir"],1],
["Minar-e-Pakistan is in?",["Karachi","Lahore","Multan","Peshawar"],1]],
world:[
["Largest continent?",["Africa","Asia","Europe","Australia"],1],
["The Eiffel Tower is in?",["Rome","Paris","Madrid","Berlin"],1],
["Pyramids of Giza are in?",["Egypt","Greece","Mexico","India"],0],
["Currency of Japan?",["Yuan","Won","Yen","Rupee"],2],
["Smallest continent?",["Europe","Australia","Antarctica","South America"],1]]
};
function startQuiz(){
 let list=quizzes[category]||quizzes.general,q=0,points=0;
 $("gameTitle").textContent="🧠 "+category+" Quiz";
 function show(){
  if(q===list.length){finish(points,"Quiz completed!");return}
  let item=list[(q+(level-1)*3)%list.length];
  area.innerHTML="<h3>Question "+(q+1)+" of "+list.length+"</h3><h2>"+item[0]+"</h2>";
  item[1].forEach((v,i)=>area.append(button(String.fromCharCode(65+i)+". "+v,()=>{
   if(roundDone)return;
   if(i===item[2])points+=10;
   else status("Correct answer: "+item[1][item[2]]);
   q++;timer=setTimeout(show,350);
  },"option")));
 }
 show();
}

/* MATCH 3 - MOBILE DRAG FIX */
function startMatch3(){
 intro("💎 Candy Match","Drag a gem onto a neighbour or tap two gems. Match 3 or more of the same fruit.");
 const n=8,icons=["🍒","🍋","🍇","🍊","🍏","🫐"];
 const colors=["#d94f70","#e5b94d","#9b70d6","#e98c43","#65b978","#559ed6"];
 let board=[],moves=25,target=25+level%8,selected=-1,dragStart=-1;
 function rand(){return Math.floor(Math.random()*6)}
 function matches(){
  let found=new Set();
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
   let v=board[r*n+c],len=1;
   if(c+2<n&&v===board[r*n+c+1]&&v===board[r*n+c+2]){
    while(c+len<n&&board[r*n+c+len]===v)len++;
    for(let k=0;k<len;k++)found.add(r*n+c+k);
   }
   if(r+2<n&&v===board[(r+1)*n+c]&&v===board[(r+2)*n+c]){
    while(r+len<n&&board[(r+len)*n+c]===v)len++;
    for(let k=0;k<len;k++)found.add((r+k)*n+c);
   }
  }
  return [...found];
 }
 function settle(){
  let hit=matches(),guard=0;
  while(hit.length&&guard++<30){
   target-=hit.length;
   hit.forEach(i=>board[i]=-1);
   for(let c=0;c<n;c++){
    let vals=[];
    for(let r=n-1;r>=0;r--)if(board[r*n+c]!==-1)vals.push(board[r*n+c]);
    for(let r=n-1;r>=0;r--)board[r*n+c]=vals[n-1-r]===undefined?rand():vals[n-1-r];
   }
   hit=matches();
  }
 }
 function adjacent(a,b){
  return Math.abs(a-b)===n||
   (Math.floor(a/n)===Math.floor(b/n)&&Math.abs(a-b)===1);
 }
 function render(){
  area.innerHTML=
   '<div class="game-hud"><span>Moves: '+moves+'</span><span>Target: '+Math.max(0,target)+'</span><span>Level '+level+'</span></div>'+
   '<div id="matchBoard"></div>'+
   '<p class="small">Finger se gem ko pakar kar neighbour par chhor dein. Tap controls bhi available hain.</p>';
  const grid=$("matchBoard");
  board.forEach((v,i)=>{
   let b=document.createElement("button");
   b.className="gem"+(selected===i?" selected":"");
   b.textContent=icons[v];b.style.background=colors[v];
   b.dataset.index=i;grid.append(b);
  });
  grid.addEventListener("pointerdown",e=>{
   let cell=e.target.closest(".gem");
   if(!cell)return;
   e.preventDefault();
   dragStart=+cell.dataset.index;
  });
  grid.addEventListener("pointerup",e=>{
   if(dragStart<0)return;
   e.preventDefault();
   let rect=grid.getBoundingClientRect();
   let x=e.clientX-rect.left,y=e.clientY-rect.top;
   let col=Math.floor(x/(rect.width/n));
   let row=Math.floor(y/(rect.height/n));
   let dest=row*n+col;
   let from=dragStart;dragStart=-1;
   if(row<0||row>=n||col<0||col>=n)return;
   if(dest!==from){selected=-1;swap(from,dest)}
   else tap(from);
  });
  grid.addEventListener("pointercancel",()=>dragStart=-1);
 }
 function tap(i){
  if(roundDone)return;
  if(selected<0){selected=i;render();return}
  let old=selected;selected=-1;
  if(old===i){render();return}
  if(adjacent(old,i))swap(old,i);
  else{selected=i;render()}
 }
 function swap(a,b){
  if(roundDone||!adjacent(a,b))return;
  [board[a],board[b]]=[board[b],board[a]];
  if(!matches().length){
   [board[a],board[b]]=[board[b],board[a]];
   status("Aisi move karein jis se 3 gems match hon.");
   render();return;
  }
  moves--;settle();
  status("Nice! Match complete.");
  if(target<=0){finish(35,"Target reached!");return}
  if(moves<=0){retry("Moves khatam! Dobara try karein.");return}
  render();
 }
 board=Array.from({length:n*n},rand);
 let guard=0;
 while(matches().length&&guard++<100)matches().forEach(i=>board[i]=rand());
 render();
}

/* RACING */
function startRacing(){
 intro("🏎️ Car Racing","Steer your car, avoid traffic and collect coins.");
 area.innerHTML=
 '<div class="game-hud"><span>Coins: <b id="coins">0</b></span><span>Distance: <b id="distance">0</b></span></div>'+
 '<canvas id="raceCanvas" width="480" height="700"></canvas>'+
 '<div class="race-controls"><button class="secondary" id="left">⬅ LEFT</button><button class="secondary" id="right">RIGHT ➡</button></div>';
 let c=$("raceCanvas"),ctx=c.getContext("2d"),lane=1,objects=[],coins=0,dist=0,tick=0,last=0,running=true;
 const roadX=45,roadW=390,laneW=130;
 function steer(d){lane=Math.max(0,Math.min(2,lane+d))}
 $("left").onclick=()=>steer(-1);$("right").onclick=()=>steer(1);
 let sx=0;
 c.addEventListener("pointerdown",e=>sx=e.clientX);
 c.addEventListener("pointerup",e=>{let d=e.clientX-sx;if(Math.abs(d)>15)steer(d>0?1:-1)});
 function car(x,y,color){
  ctx.fillStyle="#15131b";ctx.fillRect(x-24,y-42,48,84);
  ctx.fillStyle=color;ctx.fillRect(x-19,y-38,38,76);
  ctx.fillStyle="#b9efff";ctx.fillRect(x-14,y-24,28,20);
  ctx.fillStyle="#111";ctx.fillRect(x-27,y-22,5,18);ctx.fillRect(x+22,y-22,5,18);
 }
 function frame(ts){
  if(!running)return;
  let dt=Math.min(2,(ts-last)/16.67||1);last=ts;
  ctx.fillStyle="#397b4b";ctx.fillRect(0,0,480,700);
  ctx.fillStyle="#373945";ctx.fillRect(roadX,0,roadW,700);
  ctx.fillStyle="#eee";ctx.fillRect(roadX,0,5,700);ctx.fillRect(roadX+roadW-5,0,5,700);
  tick+=dt;dist+=dt;
  $("distance").textContent=Math.floor(dist);
  if(tick>55){tick=0;objects.push({lane:Math.floor(Math.random()*3),y:-50,coin:Math.random()<.3})}
  objects.forEach(o=>{
   o.y+=5*dt;let x=roadX+laneW*(o.lane+.5);
   if(o.coin){ctx.fillStyle="#ffcf39";ctx.beginPath();ctx.arc(x,o.y,15,0,7);ctx.fill()}
   else car(x,o.y,"#e14e61");
  });
  let px=roadX+laneW*(lane+.5),py=590;
  car(px,py,"#28b9f4");
  let hit=false;
  objects=objects.filter(o=>{
   if(o.lane===lane&&Math.abs(o.y-py)<55){
    if(o.coin){coins++;$("coins").textContent=coins;return false}
    hit=true;
   }
   return o.y<750;
  });
  if(hit){running=false;status("Crash! Distance: "+Math.floor(dist));actions.innerHTML="";actions.append(button("Play Again",startRacing,"green"));return}
  if(dist>500+level*20){running=false;finish(30+coins*3,"Race completed!");return}
  raf=requestAnimationFrame(frame);
 }
 raf=requestAnimationFrame(frame);
}

/* LUDO - SIMPLE LOCAL BOARD */
function startLudo(){
 intro("🎲 Ludo","Local multiplayer. Roll the dice and tap one of your tokens. A six releases a token.");
 area.innerHTML=
 '<select id="players"><option value="2">2 Players</option><option value="3">3 Players</option><option value="4" selected>4 Players</option></select>'+
 '<div class="ludo-wrap"><canvas id="ludo" class="ludo-board" width="600" height="600"></canvas></div>'+
 '<div class="ludo-actions"><div class="dice-face" id="face">🎲</div><button id="roll">Roll Dice</button></div><p id="ludoInfo" class="small"></p>';
 const cv=$("ludo"),ctx=cv.getContext("2d"),colors=["#e84c4c","#35a96b","#e6b83f","#4289d5"];
 const path=[];
 for(let c=0;c<6;c++)path.push([6,c]);
 for(let r=5;r>=0;r--)path.push([r,6]);
 for(let r=0;r<6;r++)path.push([r,7]);
 for(let c=8;c<15;c++)path.push([6,c]);
 for(let r=7;r<15;r++)path.push([r,8]);
 for(let c=7;c>=0;c--)path.push([8,c]);
 let players=4,turn=0,dice=0,steps=Array.from({length:4},()=>[-1,-1,-1,-1]);
 function draw(){
  ctx.fillStyle="#f6f0df";ctx.fillRect(0,0,600,600);
  ctx.fillStyle=colors[0];ctx.fillRect(0,0,240,240);
  ctx.fillStyle=colors[1];ctx.fillRect(360,0,240,240);
  ctx.fillStyle=colors[2];ctx.fillRect(360,360,240,240);
  ctx.fillStyle=colors[3];ctx.fillRect(0,360,240,240);
  path.forEach(([r,c],i)=>{
   ctx.fillStyle="#fff";ctx.fillRect(c*40,r*40,40,40);
   ctx.strokeStyle="#aaa";ctx.strokeRect(c*40,r*40,40,40);
  });
  steps.forEach((arr,p)=>arr.forEach((v,t)=>{
   let x,y;
   if(v<0){x=(p%2?480:120)+(t%2?30:-30);y=(p>1?480:120)+(t>1?30:-30)}
   else{let q=path[(v+p*13)%path.length];x=q[1]*40+20;y=q[0]*40+20}
   ctx.beginPath();ctx.arc(x,y,14,0,7);ctx.fillStyle=colors[p];ctx.fill();
   ctx.strokeStyle=p===turn?"#fff":"#222";ctx.lineWidth=3;ctx.stroke();
   ctx.fillStyle="#fff";ctx.font="bold 12px Arial";ctx.textAlign="center";ctx.fillText(t+1,x,y+4);
  }));
  $("ludoInfo").textContent="Player "+(turn+1)+" "+(dice?"· Dice "+dice:"· Roll dice");
 }
 function next(extra){dice=0;if(!extra)turn=(turn+1)%players;$("roll").disabled=false;draw()}
 $("players").onchange=e=>{
  players=+e.target.value;turn=0;dice=0;
  steps=Array.from({length:4},()=>[-1,-1,-1,-1]);draw();
 };
 $("roll").onclick=()=>{
  if(dice)return;
  dice=1+Math.floor(Math.random()*6);
  $("face").textContent=["⚀","⚁","⚂","⚃","⚄","⚅"][dice-1];
  if(dice!==6&&steps[turn].every(v=>v<0)){status("No token can move. Turn passes.");setTimeout(()=>next(false),700)}
  else status("Apne token par tap karein.");
  draw();
 };
 cv.onclick=e=>{
  if(!dice)return;
  let rect=cv.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*600,y=(e.clientY-rect.top)/rect.height*600;
  let chosen=-1,dist=999;
  steps[turn].forEach((v,t)=>{
   let xx,yy;
   if(v<0){xx=(turn%2?480:120)+(t%2?30:-30);yy=(turn>1?480:120)+(t>1?30:-30)}
   else{let q=path[(v+turn*13)%path.length];xx=q[1]*40+20;yy=q[0]*40+20}
   let d=Math.hypot(x-xx,y-yy);if(d<dist){dist=d;chosen=t}
  });
  if(chosen<0||dist>35)return;
  if(steps[turn][chosen]<0){if(dice!==6)return;steps[turn][chosen]=0}
  else steps[turn][chosen]+=dice;
  if(steps[turn][chosen]>=path.length){steps[turn][chosen]=path.length-1}
  if(steps[turn].every(v=>v>=path.length-1)){finish(50,"Player "+(turn+1)+" wins!");return}
  next(dice===6);
 };
 draw();
}

/* DIFFERENCE */
function startDifference(){
 intro("🔎 Find the Difference","Find five different details between the two pictures.");
 let found=new Set();
 const targets=[[150,50],[55,140],[150,165],[240,145],[270,205]];
 function svg(side){
  let s='<svg viewBox="0 0 300 220"><rect width="300" height="220" fill="#8bd8f1"/><circle cx="250" cy="40" r="23" fill="#ffe078"/><rect y="185" width="300" height="35" fill="#72b96d"/><rect x="35" y="105" width="65" height="90" fill="#f4a261"/><rect x="125" y="75" width="72" height="120" fill="#d98cba"/><rect x="220" y="125" width="48" height="70" fill="#e9c46a"/>';
  s+=side===0?
  '<circle cx="150" cy="50" r="12" fill="#ffe16a"/><rect x="43" y="130" width="24" height="27" fill="#7ed6ee"/><circle cx="150" cy="165" r="13" fill="#e95e7d"/><circle cx="240" cy="145" r="12" fill="white"/><path d="M258 204l7 -12 7 12 12 -3 -7 11 7 8h-35z" fill="#f5d65c"/>':
  '<circle cx="150" cy="50" r="12" fill="#ff7d52"/><rect x="43" y="130" width="24" height="27" fill="#f4d16b"/><circle cx="150" cy="165" r="13" fill="#5c9ee8"/><circle cx="240" cy="145" r="12" fill="#ffcf54"/><path d="M258 204l7 -12 7 12 12 -3 -7 11 7 8h-35z" fill="#e85c8b"/>';
  return s+"</svg>";
 }
 area.innerHTML='<div class="diff-pictures"><div class="picture" data-side="0"><b>A</b>'+svg(0)+'</div><div class="picture" data-side="1"><b>B</b>'+svg(1)+'</div></div><p id="count" class="small">Found: 0 / 5</p>';
 document.querySelectorAll(".picture").forEach(pic=>pic.onclick=e=>{
  let r=pic.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*300,y=(e.clientY-r.top)/r.width*220;
  let best=-1,d=999;targets.forEach((p,i)=>{let z=Math.hypot(x-p[0],y-p[1]);if(z<d){d=z;best=i}});
  if(d<32&&!found.has(best)){
   found.add(best);let m=document.createElement("div");m.className="diff-mark";
   m.style.left=targets[best][0]/3+"%";m.style.top=targets[best][1]/2.2+"%";pic.append(m);
   $("count").textContent="Found: "+found.size+" / 5";
   if(found.size===5)finish(25,"All differences found!");
  }else status("Keep looking!");
 });
}

function startNumber(){
 intro("🔢 Number Puzzle","Arrange numbers 1 to 8 in order.");
 let b=[1,2,3,4,5,6,7,0,8];
 function draw(){
  area.innerHTML='<div class="number-grid" id="ng"></div>';
  b.forEach((v,i)=>$("ng").append(button(v||" ",()=>{
   let e=b.indexOf(0);
   if(Math.abs(i-e)!==3&&!(Math.abs(i-e)===1&&Math.floor(i/3)===Math.floor(e/3)))return;
   [b[i],b[e]]=[b[e],b[i]];
   if(b.join(",")==="1,2,3,4,5,6,7,8,0"){finish(20,"Solved!");return}
   draw();
  },"secondary")));
 }
 draw();
}
function startMemory(){
 intro("🧠 Memory Match","Find all matching pairs.");
 let s=["🍎","🍋","🍇","⭐","🚗","🐱"],deck=s.concat(s).sort(()=>Math.random()-.5),open=[],matched=[],lock=false;
 function draw(){
  area.innerHTML='<div class="memory-grid" id="mg"></div><p class="small">Pairs: '+matched.length/2+' / '+s.length+'</p>';
  deck.forEach((v,i)=>$("mg").append(button(matched.includes(i)||open.includes(i)?v:"❔",()=>flip(i),"memory-card")));
 }
 function flip(i){
  if(lock||matched.includes(i)||open.includes(i))return;
  open.push(i);draw();
  if(open.length===2){
   lock=true;
   if(deck[open[0]]===deck[open[1]]){
    matched.push(...open);open=[];lock=false;draw();
    if(matched.length===deck.length)finish(25,"All pairs matched!");
   }else timer=setTimeout(()=>{open=[];lock=false;draw()},700);
  }
 }
 draw();
}
function startWordSearch(){
 intro("🔠 Word Search","Tap letters in order to spell the hidden word.");
 let w=["CAT","SUN","DOG","CAR","MAP","PEN","HAT","CUP"][(level-1)%8];
 let a=w.split("");while(a.length<25)a.push("ABCDEFGHIJKLMNOPQRSTUVWXYZ"[Math.floor(Math.random()*26)]);
 a.sort(()=>Math.random()-.5);let chosen="";
 area.innerHTML='<h3>Find: '+w+'</h3><p id="chosen" class="small"></p><div class="letter-grid" id="lg"></div>';
 a.forEach(v=>$("lg").append(button(v,()=>{
  chosen+=v;$("chosen").textContent=chosen;
  if(chosen===w)finish(15,"Word found!");
  else if(!w.startsWith(chosen)){chosen="";$("chosen").textContent="";status("Start again.");}
 })));
 actions.append(button("Clear",()=>{chosen="";$("chosen").textContent=""},"secondary"));
}
function startReaction(){
 intro("⚡ Reaction Test","Wait for green, then tap as quickly as possible.");
 let b=button("Start",()=>{
  b.disabled=true;b.textContent="Wait...";
  timer=setTimeout(()=>{
   let t=Date.now();b.disabled=false;b.textContent="TAP NOW!";b.className="green";
   b.onclick=()=>finish(Math.max(5,30-Math.floor((Date.now()-t)/100)),"Reaction time: "+(Date.now()-t)+" ms");
  },1200+Math.random()*2800);
 });
 area.append(b);
}
function startSudoku(){
 intro("🔢 Mini Sudoku","Fill the missing numbers. Each row and column needs 1, 2, 3, 4.");
 let sol=[[1,2,3,4],[3,4,1,2],[2,1,4,3],[4,3,2,1]],p=sol.map(r=>r.slice());
 [0,5,10,15].forEach(i=>p[Math.floor(i/4)][i%4]=0);
 area.innerHTML='<div class="sudoku-grid" id="sg"></div>';
 p.forEach((r,y)=>r.forEach((v,x)=>{
  let i=document.createElement("input");i.maxLength=1;i.inputMode="numeric";i.value=v||"";i.disabled=!!v;i.dataset.r=y;i.dataset.c=x;$("sg").append(i);
 }));
 actions.append(button("Check",()=>{
  let ok=[...$("sg").querySelectorAll("input")].every(i=>+i.value===sol[+i.dataset.r][+i.dataset.c]);
  if(ok)finish(25,"Sudoku solved!");else status("Some answers are incorrect.");
 }));
}
